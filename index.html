<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tyska – öva inför provet</title>
<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#1f2328; --muted:#5f6670; --line:#e2ded5;
  --accent:#c8442b; --accent-ink:#ffffff; --accent-soft:#fbe7e2;
  --ok:#1f7a4d; --ok-soft:#e1f3e9; --bad:#b3261e; --bad-soft:#fbe4e2; --warn:#8a5a00; --warn-soft:#fdf1d6;
  --der:#2563c9; --die:#c8325a; --das:#1f8a4c; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181c; --card:#20242a; --ink:#ecedef; --muted:#a3a9b2; --line:#343a42;
    --accent:#ef7356; --accent-ink:#1b1b1b; --accent-soft:#3a2520;
    --ok:#5fd394; --ok-soft:#183126; --bad:#ff8a80; --bad-soft:#3a1f1d; --warn:#f2c26b; --warn-soft:#3a2f17;
    --der:#7fb0ff; --die:#ff8fb0; --das:#6fd69a; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#16181c; --card:#20242a; --ink:#ecedef; --muted:#a3a9b2; --line:#343a42;
  --accent:#ef7356; --accent-ink:#1b1b1b; --accent-soft:#3a2520;
  --ok:#5fd394; --ok-soft:#183126; --bad:#ff8a80; --bad-soft:#3a1f1d; --warn:#f2c26b; --warn-soft:#3a2f17;
  --der:#7fb0ff; --die:#ff8fb0; --das:#6fd69a; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}
header.top h1{font-size:1.35rem;margin:0;flex:1;letter-spacing:-.01em}
header.top .flag{width:30px;height:20px;border-radius:3px;overflow:hidden;display:flex;flex-direction:column;flex:none;box-shadow:0 0 0 1px var(--line)}
.flag i{flex:1;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;min-height:44px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent}
.btn.small{padding:6px 12px;min-height:36px;font-size:.92rem}
.link{background:none;border:0;color:var(--muted);padding:6px 0;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-height:112px}
.tile:hover{border-color:var(--accent)}
.tile .em{font-size:1.6rem;line-height:1}
.tile b{font-size:1.05rem}
.tile small{color:var(--muted)}
.tile .best{margin-top:auto;font-size:.82rem;color:var(--ok)}
.tile.exam{background:var(--accent-soft);border-color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
h2{font-size:1.25rem;margin:0 0 8px}
h3{font-size:1.02rem;margin:16px 0 6px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.back{margin-bottom:10px}
table{border-collapse:collapse;width:100%}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.85rem;color:var(--muted);font-weight:600}
.tbl-wrap{overflow-x:auto}
.de{font-weight:600}
.art-der{color:var(--der)} .art-die{color:var(--die)} .art-das{color:var(--das)}
.pill{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:3px;background:var(--card);user-select:none}
label.pill{cursor:pointer}
label.pill input{margin-right:6px;accent-color:var(--accent)}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:12px 14px;text-align:left;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;width:1.4em;color:var(--muted);font-size:.85rem}
.qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:8px;gap:8px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.prompt{font-size:1.25rem;font-weight:600;margin:4px 0}
.prompt .big{font-size:2.2rem}
.hint{color:var(--muted);font-size:.93rem}
input[type=text],input[type=number],select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:46px}
input[type=text]:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.answer-row{display:flex;gap:8px;margin-top:12px}
.answer-row input{flex:1;min-width:0}
.fb{margin-top:12px;border-radius:10px;padding:10px 14px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.warn{background:var(--warn-soft);color:var(--warn)}
.fb .corr{color:var(--ink);font-weight:600}
.fb .exp{color:var(--ink);font-size:.93rem;margin-top:4px}
.speak{border:1px solid var(--line);background:var(--card);border-radius:999px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;font-size:1.1rem;vertical-align:middle;flex:none}
.score{font-size:2.6rem;font-weight:700;margin:0}
.mist{list-style:none;padding:0;margin:8px 0 0}
.mist li{border-bottom:1px solid var(--line);padding:8px 0}
.clock{display:block;margin:6px auto 0;width:190px;height:190px}
.flash{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;font-size:1.5rem;font-weight:600;gap:6px}
.flash small{font-size:.9rem;font-weight:400;color:var(--muted)}
.theory p{margin:6px 0}
.theory .ex{background:var(--bg);border-radius:10px;padding:10px 12px;margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px}
.tip{background:var(--warn-soft);color:var(--ink);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:.95rem}
textarea{font:inherit;width:100%;min-height:150px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form2 label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
@media (max-width:520px){.form2{grid-template-columns:1fr}.prompt{font-size:1.12rem}.grid{grid-template-columns:1fr 1fr}.tile{min-height:104px;padding:12px}}
footer{color:var(--muted);font-size:.85rem;margin-top:24px}
</style>
</head>

function norm(s){
  return String(s).toLowerCase().replace(/[’`´]/g,"'").replace(/\.\.\.|…/g,' ')
    .replace(/[?!.,;:"„“”()¿¡–-]/g,' ').replace(/\s+/g,' ').trim();
}
function fold(s){ return s.replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss'); }
function stripCase(s){ return String(s).replace(/[’`´]/g,"'").replace(/\.\.\.|…/g,' ').replace(/[?!.,;:"„“”()¿¡–-]/g,' ').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,i)=>i);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
// returnerar {ok:bool, level:'ok'|'case'|'fold'|'near'|'bad', note}
function checkTyped(input, answers, opts={}){
  const ni = norm(input);
  if(!ni) return {ok:false, level:'bad'};
  for(const a of answers){
    if(norm(a) === ni){
      if(opts.caseMatters!==false && stripCase(a) !== stripCase(input) && /[A-ZÄÖÜ]/.test(a.slice(1)+ (opts.firstCap? a[0]:''))){
        return {ok:true, level:'case', note:'Rätt! Men tänk på stor bokstav – på tyska skrivs alla substantiv (och veckodagar) med stor bokstav.'};
      }
      return {ok:true, level:'ok'};
    }
  }
  for(const a of answers){ if(fold(norm(a)) === fold(ni)) return {ok:true, level:'fold', note:'Rätt, men stava med ä, ö, ü och ß som på tyska.'}; }
  for(const a of answers){
    const na = norm(a), d = lev(na, ni);
    if((na.length>=4 && d<=1) || (na.length>=10 && d<=2)) return {ok:false, level:'near', note:'Nästan! Kolla stavningen.'};
  }
  return {ok:false, level:'bad'};
}

}

}

function capLike(src, w){ return /^[A-ZÄÖÜ]/.test(src) ? w.charAt(0).toUpperCase()+w.slice(1) : w; }
function mutations(sentence, lang){
  const m = String(sentence).match(/^(.*?)([?!.]*)$/); const body=m[1], end=m[2];
  const toks = body.split(' '); const map = lang==='de'?MUT_DE:MUT_SV; const out=[];
  toks.forEach((t,i)=>{ const core=t.replace(/[,]$/,''), comma=t.endsWith(',')?',':''; const alts=map[core.toLowerCase()];
    if(alts) alts.forEach(a=>{ const c=toks.slice(); c[i]=capLike(core,a)+comma; out.push(c.join(' ')+end); }); });
  if(lang==='de' && toks.length>=3){
    if(end==='?'){ const i=toks.findIndex((t,k)=>k>0 && /^(du|ihr|wir)$/i.test(t)); if(i>1){ const c=toks.slice(); [c[i-1],c[i]]=[c[i],c[i-1]]; out.push(c.join(' ')+end); } }
    else { const c=toks.slice(); const v=c.splice(1,1)[0]; c.push(v); out.push(c.join(' ')+end); }
  }
  return [...new Set(out)];
}
function similarity(a,b){ const wa=a.split(' ').length, wb=b.split(' ').length;
  return Math.abs(wa-wb)*3 + (/[?!.]$/.test(a)!==/[?!.]$/.test(b)?3:0) + Math.abs(a.length-b.length)/5 + (/^[A-ZÄÖÜ]/.test(a)!==/^[A-ZÄÖÜ]/.test(b)?1:0); }
function hardOptions(correct, pool, lang, opt={}){
  const n=4, bad=new Set([norm(correct), ...(opt.exclude||[]).map(norm)]); const opts=[correct];
  const add=x=>{ if(opts.length<n && !bad.has(norm(x)) && !opts.some(o=>o===x)){ opts.push(x); bad.add(norm(x)); } };
  if(opt.art){ ['der','die','das'].filter(a=>a!==opt.art).forEach(a=>{ if(Math.random()<.6) add(a+' '+opt.noun); }); }
  const words = correct.split(' ').length;
  if(words>=2){ shuffle(mutations(correct, lang)).slice(0, words>=3?3:2).forEach(add); }
  const similar = pool.filter(x=>!bad.has(norm(x))).map(x=>[x, similarity(x,correct)+Math.random()*1.5]).sort((a,b)=>a[1]-b[1]).slice(0,6).map(x=>x[0]);
  shuffle(similar).forEach(add);
  if(opts.length<n) shuffle(pool).forEach(add);
  return shuffle(opts);
}

/* Klockan */
function randTime(){ return [1+rnd(12), pick([0,0,15,30,30,45,5,10,20,25,35,40,50,55])]; }
function timeDistractors(h,m){
  const c=timeDe(h,m), set=new Set([c]);
  const cands=[];
  if(m===30){ cands.push('halb '+U[h12(h)]); }
  if(m===15) cands.push('Viertel vor '+U[h12(h)]); if(m===45) cands.push('Viertel nach '+U[h12(h+1)]);
  if(m>0 && m!==30) cands.push(timeDe(h,60-m===60?0:60-m));
  if(m===25) cands.push('fünf nach halb '+U[h12(h+1)]); if(m===35) cands.push('fünf vor halb '+U[h12(h+1)]);
  cands.push(timeDe(h+1,m), timeDe(h,(m+30)%60), timeDe(h+11,m));
  const out=[];
  for(const x of shuffle(cands)){ if(!set.has(x)){ set.add(x); out.push(x);} if(out.length===3) break; }
  while(out.length<3){ const [a,b]=randTime(); const x=timeDe(a,b); if(!set.has(x)){set.add(x);out.push(x);} }
  return shuffle([c,...out]);
}
const UM_ACTS = [['Wann geht Armin ins Schwimmbad?','gå till simhallen'],['Wann spielt Armin Computerspiele?','spela datorspel'],['Wann singt Armin im Schulchor?','sjunga i skolkören'],

function genClock(){

  if(t===1) return {kind:'type', label:'Klockan – skriv', prompt:clockSvg(h,m), hint:'Wie spät ist es? Skriv på tyska (t.ex. "Viertel nach vier").', answers:timeAnswers(h,m), correct:'Es ist '+de, say:'Es ist '+de, caseMatters:false, explain:'På svenska: '+timeSv(h,m)+'.'};
  if(t===2) return {kind:'type', label:'Klockan – översätt', prompt:'Klockan är '+esc(timeSv(h,m).replace(/^klockan /,''))+'.', hint:'Skriv på tyska: Es ist …', answers:timeAnswers(h,m), correct:'Es ist '+de, say:'Es ist '+de, caseMatters:false};
  if(t===3){ const opts=shuffle([[h,m],[h+1,m],[h,(m+30)%60],[h, m===0?30:(60-m)%60]]).map(([a,b])=>dig(a,b));
    const uniq=[...new Set(opts)]; while(uniq.length<4){ const [a,b]=randTime(); const x=dig(a,b); if(!uniq.includes(x)) uniq.push(x); }
    return {kind:'mc', label:'Klockan – förstå', prompt:`Es ist ${esc(de)}. ${speakBtn('Es ist '+de)}`, hint:'Vilken tid är det?', options:shuffle(uniq), answer:dig(h,m), correct:dig(h,m)+' = '+de};
  }
  if(t===4){ const a=pick(UM_ACTS); const hh=(h12(h)%12)+(Math.random()<.5?12:0);
    return {kind:'type', label:'Klockan med "um"', prompt:`${esc(a[0])} <span class="muted">(${pad(hh)}:${pad(m)})</span>`, hint:'Svara med <b>um</b> + klockslag, t.ex. "Um halb drei."', answers:timeAnswers(h,m,'Um'), correct:'Um '+de+'.', say:'Um '+de, caseMatters:false, checkUm:true,
      explain:'När något händer en viss tid använder man <b>um</b>: Wann? – Um '+esc(de)+'.'}; }
  const um=Math.random()<.5;
  const prompt = um ? pick([`Wir treffen uns ___ ${de}.`,`Die Schule beginnt ___ ${de}.`,`Wann kommst du? – ___ ${de}.`,`Armin spielt ___ ${de} Handball.`])
                    : pick([`Wie spät ist es? – ___ ${de}.`,`Wie viel Uhr ist es? – ___ ${de}.`]);
  return {kind:'mc', label:'Es ist eller um?', prompt:esc(prompt), hint:'Vilket passar i luckan?', options:['Es ist','um'], keepOrder:true, answer:um?'um':'Es ist', correct:prompt.replace('___', um?'um':'Es ist'),
    explain: um?'<b>um</b> = "klockan" när något händer (Wann? – Um …).':'<b>Es ist …</b> = "Klockan är …" (svar på Wie spät ist es?).'};
}

function genVerb(onlyRegular){
  const pool = onlyRegular? VERBS.filter(v=>v[6]!=='o') : VERBS;
  const v=pick(pool); const p=rnd(3);
  let subj, svSubj, form;
  if(p===0){ subj='ich'; svSubj='jag'; form=v[2]; }
  else if(p===1){ subj='du'; svSubj='du'; form=v[3]; }
  else { const s=pick(SUBJ3); subj=s[0]; svSubj=s[1]; form=v[4]; }
  const S = subj.charAt(0).toUpperCase()+subj.slice(1);
  const note = v[6]==='o'? 'Oregelbundet verb – lär dig formerna utantill.' : v[6]==='s' ? (/(t)en$/.test(v[0])? 'Stammen slutar på -t, därför -est/-et.' : 'Stammen slutar på s/ß – du-formen får bara -t.') : 'Stam + -e (ich), -st (du), -t (er/sie/es).';
  const table = `${esc(v[0])}: ich ${esc(v[2])}, du ${esc(v[3])}, er/sie/es ${esc(v[4])}`;
  if(Math.random()<.7) return {kind:'type', label:'Verbböjning i singular', prompt:`${esc(S)} ___ <span class="muted">(${esc(v[0])})</span>`, hint:`= ${esc(svSubj)} ${esc(v[5])}. Skriv rätt form av verbet.`, answers:[form, subj+' '+form], correct:S+' '+form, say:S+' '+form, caseMatters:false, explain:note+' '+table};
  const opts=[...new Set([v[2],v[3],v[4],v[0]])];
  while(opts.length<4) opts.push(v[0].replace(/en$/,'et'));
  return {kind:'mc', label:'Verbböjning i singular', prompt:`${esc(S)} ___ <span class="muted">(${esc(v[0])})</span>`, hint:`= ${esc(svSubj)} ${esc(v[5])}`, options:shuffle(opts), answer:form, correct:S+' '+form, say:S+' '+form, explain:note+' '+table};
}

/* ================= QUIZMOTOR ================= */
let session=null;
function startQuiz(title, makeQuestions, opts={}){
  const qs = makeQuestions();
  session = {title, queue:qs.map(q=>({...q, first:true})), total:qs.length, idx:0, right:0, done:0, mistakes:[], retry:opts.retry!==false, key:opts.key, again:()=>startQuiz(title, makeQuestions, opts), back:opts.back||home};
  showQ();
}
function showQ(){
  const s=session; const q=s.queue[s.idx];
  if(!q){ return showResult(); }
  const progress = Math.round(100*s.done/s.total);
  let body='';
  if(q.kind==='mc'){
    const opts = q.keepOrder? q.options : q.options;
    body = `<div class="opts">${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${i+1}</span>${esc(o)}</button>`).join('')}</div>`;
  } else {
    body = `<form class="answer-row" id="af" autocomplete="off"><input type="text" id="ans" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Skriv ditt svar…" aria-label="Svar"><button class="btn primary" type="submit">Svara</button></form>
    <div class="row" style="margin-top:8px">${['ä','ö','ü','ß'].map(c=>`<button class="btn small" data-ch="${c}" type="button">${c}</button>`).join('')}</div>`;
  }
  app.innerHTML = `<button class="link back" id="quit">← Avsluta</button>
  <div class="card">
    <div class="qhead"><span>${esc(q.label||s.title)}</span><span>${s.done+1} / ${s.total}${q.first?'':' · repetition'}</span></div>
    <div class="bar"><i style="width:${progress}%"></i></div>
    <div class="prompt">${q.prompt}</div>
    ${q.hint?`<div class="hint">${q.hint}</div>`:''}
    ${body}
    <div id="fb"></div>
  </div>`;
  $('#quit').onclick = ()=>{ if(s.done===0 || confirmQuit()) s.back(); };
  if(q.kind==='mc'){
    app.querySelectorAll('.opt').forEach(b=> b.onclick = ()=> answerMC(+b.dataset.i));
  } else {
    const inp=$('#ans'); setTimeout(()=>inp.focus(),30);
    $('#af').onsubmit = e=>{ e.preventDefault(); if(q._answered) return next(); answerType(inp.value); };
    app.querySelectorAll('[data-ch]').forEach(b=> b.onclick=()=>{ const p=inp.selectionStart??inp.value.length; inp.value=inp.value.slice(0,p)+b.dataset.ch+inp.value.slice(inp.selectionEnd??p); inp.focus(); inp.setSelectionRange(p+1,p+1); });
  }
  if(q.autoSay) setTimeout(()=>say(q.autoSay),250);
}
function confirmQuit(){ return true; }
function feedback(ok, q, extra, level){
  const cls = ok ? (level==='case'||level==='fold'?'warn':'ok') : (level==='near'?'warn':'bad');
  const head = ok ? 'Rätt! 🎉' : (level==='near'?'Nästan…':'Inte riktigt.');
  const fb=$('#fb');
  fb.innerHTML = `<div class="fb ${cls}"><div><b>${head}</b> ${extra?esc(extra):''}</div>
    ${!ok||level==='case'||level==='fold'?`<div class="exp">Rätt svar: <span class="corr">${esc(q.correct)}</span> ${q.say?speakBtn(q.say):''}</div>`:(q.say?`<div class="exp">${esc(q.correct)} ${speakBtn(q.say)}</div>`:'')}
    ${q.explain?`<div class="exp">${q.explain}</div>`:''}
  </div>
  <div class="row" style="margin-top:12px">
    <button class="btn primary" id="nextBtn">Nästa →</button>
    ${!ok && q.kind==='type'?'<button class="btn small ghost" id="override">Jag hade rätt – räkna det</button>':''}
  </div>`;
  $('#nextBtn').onclick = next;
  const ov=$('#override'); if(ov) ov.onclick=()=>{ q._override=true; registerResult(q,true,true); next(); };
  setTimeout(()=>$('#nextBtn').focus(),20);
}
function registerResult(q, ok, override){
  const s=session;
  if(override){ // ångra felmarkering
    if(q.first){ s.right++; s.mistakes.pop(); }
    s.queue = s.queue.filter(x=>x!==q._retryCopy);
    return;
  }
  if(q.first){ if(ok) s.right++; else s.mistakes.push(q); }
  if(!ok && s.retry && q.first){ const copy={...q, first:false, _answered:false}; q._retryCopy=copy; const pos=Math.min(s.queue.length, s.idx+3); s.queue.splice(pos,0,copy); }
}
function answerMC(i){
  const q=session.queue[session.idx]; if(q._answered) return; q._answered=true;
  const chosen=q.options[i], ok = chosen===q.answer;
  app.querySelectorAll('.opt').forEach((b,j)=>{ b.disabled=true; if(q.options[j]===q.answer) b.classList.add('right'); else if(j===i) b.classList.add('wrong'); });
  registerResult(q, ok);
  feedback(ok, q, '', ok?'ok':'bad');
}
function answerType(val){
  const q=session.queue[session.idx];
  if(!val.trim()) return;
  q._answered=true;
  let r = checkTyped(val, q.answers, {caseMatters:q.caseMatters, firstCap:q.firstCap});
  let extra = r.note||'';
  if(q.checkUm && !r.ok){
    const r2 = checkTyped('Um '+val, q.answers, {caseMatters:false});
    if(r2.ok){ r={ok:false, level:'near'}; extra='Du glömde "um"! Wann? – Um …'; }
  }
  $('#ans').readOnly=true;
  registerResult(q, r.ok);
  feedback(r.ok, q, extra, r.level);
}
function next(){ const s=session; s.done++; s.idx++; if(s.idx>=s.queue.length) return showResult(); s.total=Math.max(s.total, s.queue.length); showQ(); }
function showResult(){
  const s=session; const firstTotal=s.queue.filter(q=>q.first).length; const pct=Math.round(100*s.right/firstTotal);
  if(s.key){ const best=store.get('best',{}); if(!best[s.key]||pct>best[s.key]) {best[s.key]=pct; store.set('best',best);} }
  const msg = pct>=90?'Jättebra! Du kan det här. 🌟':pct>=70?'Bra jobbat! Öva lite till på det du missade.':pct>=50?'Halvvägs! Kör en gång till.':'Fortsätt öva – läs genomgången och försök igen.';
  app.innerHTML = `<div class="card">
    <h2>${esc(s.title)} – klart!</h2>
    <p class="score">${s.right} / ${firstTotal}</p>
    <p>${msg}</p>
    <div class="row"><button class="btn primary" id="again">Kör igen</button><button class="btn" id="home">Till startsidan</button></div>
    ${s.mistakes.length?`<h3>Det här blev fel – repetera</h3><ul class="mist">${s.mistakes.map(q=>`<li><div class="muted" style="font-size:.85rem">${esc(q.label||'')}</div><div>${q.prompt.replace(/<svg[\s\S]*<\/svg>/,'(klockan)')}</div><div>→ <b>${esc(q.correct)}</b> ${q.say?speakBtn(q.say):''}</div></li>`).join('')}</ul>`:''}
  </div>`;
  $('#again').onclick=s.again; $('#home').onclick=s.back;
}
document.addEventListener('keydown', e=>{
  if(!session || !document.querySelector('.opt')) return;
  const q=session.queue[session.idx]; if(!q) return;
  if(q._answered && e.key==='Enter'){ const nb=$('#nextBtn'); if(nb && document.activeElement!==nb){ e.preventDefault(); next(); } return; }
  const n=parseInt(e.key,10); if(!q._answered && n>=1 && n<=q.options.length) answerMC(n-1);
});

/* Glosor */
function pageVocab(){
  const st=store.get('vocabSet',{secs:VOCAB.map(s=>s.id), dir:'sv-de', mode:'type', n:20});
  app.innerHTML = `<button class="link back" id="bk">← Startsidan</button>
  <div class="card"><h2>Glosor</h2>
    <h3>Vilka avsnitt?</h3>
    <div id="secs">${VOCAB.map(s=>`<label class="pill"><input type="checkbox" value="${s.id}" ${st.secs.includes(s.id)?'checked':''}>${esc(s.title)} <span class="muted">(${s.words.length})</span></label>`).join('')}</div>
    <div class="row" style="margin-top:6px"><button class="btn small ghost" id="all">Markera alla</button><button class="btn small ghost" id="none">Avmarkera alla</button></div>
    <h3>Riktning</h3>
    <div class="row" id="dir">${[['sv-de','Svenska → tyska'],['de-sv','Tyska → svenska'],['mix','Blandat']].map(([v,l])=>`<label class="pill"><input type="radio" name="dir" value="${v}" ${st.dir===v?'checked':''}>${l}</label>`).join('')}</div>
    <h3>Svarssätt</h3>
    <div class="row">${[['type','Skriv svaret'],['mc','Flerval']].map(([v,l])=>`<label class="pill"><input type="radio" name="mode" value="${v}" ${st.mode===v?'checked':''}>${l}</label>`).join('')}</div>
    <h3>Antal ord</h3>
    <div class="row">${[10,20,40,0].map(v=>`<label class="pill"><input type="radio" name="n" value="${v}" ${st.n===v?'checked':''}>${v||'Alla'}</label>`).join('')}</div>
    <div class="row" style="margin-top:16px"><button class="btn primary" id="go">Starta förhör</button><button class="btn" id="flash">Glosvändare (kort)</button><button class="btn" id="list">Visa ordlistan</button></div>
  </div><div id="extra"></div>`;
  $('#bk').onclick=home;
  const read=()=>{ const s={secs:[...app.querySelectorAll('#secs input:checked')].map(i=>i.value), dir:app.querySelector('input[name=dir]:checked').value, mode:app.querySelector('input[name=mode]:checked').value, n:+app.querySelector('input[name=n]:checked').value}; store.set('vocabSet',s); return s; };
  $('#all').onclick=()=>app.querySelectorAll('#secs input').forEach(i=>i.checked=true);
  $('#none').onclick=()=>app.querySelectorAll('#secs input').forEach(i=>i.checked=false);
  $('#go').onclick=()=>{ const s=read(); const pool=allWords(s.secs); if(!pool.length) return alertBox('Välj minst ett avsnitt.');
    startQuiz('Glosor', ()=>{ const items=shuffle(pool).slice(0, s.n||pool.length); return items.map(it=>{ const d=s.dir==='mix'?pick(['sv-de','de-sv']):s.dir; return qVocab(it,d,s.mode,allWords(s.secs).filter(x=>x.sec.id===it.sec.id).length>=4?allWords(s.secs).filter(x=>x.sec.id===it.sec.id):pool); }); }, {key:'glosor', back:pageVocab}); };
  $('#list').onclick=()=>{ const s=read(); $('#extra').innerHTML = VOCAB.filter(x=>s.secs.includes(x.id)).map(sec=>`<div class="card"><h3 style="margin-top:0">${esc(sec.title)} <span class="muted" style="font-weight:400;font-size:.85rem">· ${esc(sec.src)}</span></h3><table>${sec.words.map(w=>`<tr><td class="de">${deHtml(w)} ${speakBtn(deFull(w))}</td><td>${esc(w[1])}</td></tr>`).join('')}</table></div>`).join(''); $('#extra').scrollIntoView({behavior:'smooth'}); };
  $('#flash').onclick=()=>{ const s=read(); const pool=shuffle(allWords(s.secs)); if(!pool.length) return alertBox('Välj minst ett avsnitt.'); flashcards(pool, s.dir); };
}
function alertBox(msg){ const e=$('#extra'); if(e) e.innerHTML=`<div class="fb bad">${esc(msg)}</div>`; }
function flashcards(pool, dir){
  let i=0, flipped=false, known=0; const again=[];
  const render=()=>{
    if(i>=pool.length){
      app.innerHTML=`<div class="card"><h2>Klart!</h2><p>Du kunde <b>${known}</b> av ${known+again.length}.</p><div class="row">${again.length?'<button class="btn primary" id="rep">Öva på de '+again.length+' du inte kunde</button>':''}<button class="btn" id="bk">Tillbaka</button></div></div>`;
      $('#bk').onclick=pageVocab; const r=$('#rep'); if(r) r.onclick=()=>flashcards(shuffle(again),dir); return; }
    const it=pool[i], w=it.w; const d = dir==='mix'? (i%2?'de-sv':'sv-de') : dir;
    const front = d==='de-sv'? deHtml(w) : esc(w[1]), back = d==='de-sv'? esc(w[1]) : deHtml(w);
    app.innerHTML=`<button class="link back" id="bk">← Avsluta</button>
    <div class="card"><div class="qhead"><span>${esc(it.sec.title)}</span><span>${i+1} / ${pool.length}</span></div>
      <div class="flash" id="fc">${flipped? `<div>${front}</div><div style="color:var(--accent)">${back}</div>${speakBtn(deFull(w))}` : `<div>${front}</div><small>Tryck för att vända (eller mellanslag)</small>`}</div>
      <div class="row" style="justify-content:center;margin-top:12px">${flipped?'<button class="btn" id="no">✗ Kunde inte</button><button class="btn primary" id="yes">✓ Kunde</button>':'<button class="btn primary" id="flip">Vänd</button>'}</div></div>`;
    $('#bk').onclick=()=>{document.onkeydown=null; pageVocab();};
    const flip=()=>{ flipped=true; render(); if(d==='sv-de') say(deFull(w)); };
    const go=k=>{ if(k) known++; else again.push(it); i++; flipped=false; render(); };
    $('#fc').onclick=()=>{ if(!flipped) flip(); };
    if(flipped){ $('#yes').onclick=()=>go(true); $('#no').onclick=()=>go(false); } else $('#flip').onclick=flip;
    document.onkeydown=e=>{ if(!document.getElementById('fc')){document.onkeydown=null;return;} if(e.key===' '&&!flipped){e.preventDefault();flip();} else if(flipped&&(e.key==='ArrowRight'||e.key==='j')) go(true); else if(flipped&&(e.key==='ArrowLeft'||e.key==='n')) go(false); };
  };
  render();
}
/* Provträning */
function pageExam(){
  app.innerHTML=`<button class="link back" id="bk">← Startsidan</button>
  <div class="card"><h2>🎯 Provträning</h2>
  <p>25 blandade frågor från allt som ingår i provet: glosor, frågeord, presentera dig, veckodagar, siffror, klockan, verb och texterna.</p>
  <p class="muted">I provläget kommer felsvar <b>inte</b> tillbaka under tiden – du får se allt du missade i slutet.</p>
  <button class="btn primary" id="go">Starta provet</button></div>`;
  $('#bk').onclick=home;
  $('#go').onclick=()=>startQuiz('Provträning', ()=>{
    const all=allWords(); const qs=[];
    shuffle(all).slice(0,5).forEach(it=>qs.push(qVocab(it,'sv-de','type',all)));
    shuffle(all).slice(0,3).forEach(it=>qs.push(qVocab(it,'de-sv','mc',all)));
    for(let i=0;i<3;i++) qs.push(genQwords());
    for(let i=0;i<3;i++) qs.push(genPres());
    for(let i=0;i<2;i++) qs.push(genDays());
    for(let i=0;i<3;i++) qs.push(genNums());
    for(let i=0;i<3;i++) qs.push(genClock());
    for(let i=0;i<2;i++) qs.push(genVerb(false));
    qs.push(genText());
    return shuffle(qs);
  }, {key:'prov', retry:false, back:pageExam});
}
/* Das bin ich */
function pageSteck(){
  const d=store.get('steck',{name:'',age:13,ort:'',land:'Schweden',fach:'Deutsch',essen:'Pizza',mag:'Computerspiele',gesch:'einen Bruder und eine Schwester'});
  const sel=(id,arr,v)=>`<select id="${id}">${arr.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
  app.innerHTML=`<button class="link back" id="bk">← Startsidan</button>
  <div class="card"><h2>🪪 Das bin ich!</h2><p class="muted">Fyll i om dig själv så skriver appen en presentation på tyska (som övning B8 i häftet). Läs den högt och lär dig den!</p>
  <div class="form2">
   <label>Namn<input type="text" id="name" value="${esc(d.name)}" placeholder="t.ex. Anton"></label>
   <label>Ålder<input type="number" id="age" min="5" max="99" value="${esc(d.age)}"></label>
   <label>Jag bor i (stad)<input type="text" id="ort" value="${esc(d.ort)}" placeholder="t.ex. Göteborg"></label>
   <label>Jag kommer från${sel('land',['Schweden','Norwegen','Dänemark','Finnland','Deutschland','Österreich','der Schweiz','Italien','Spanien','Frankreich'],d.land)}</label>
   <label>Favoritämne${sel('fach',['Deutsch','Englisch','Schwedisch','Mathe','Sport','Musik','Geschichte','Erdkunde','Kunst'],d.fach)}</label>
   <label>Favoritmat${sel('essen',['Pizza','Spaghetti','Wurst','Hamburger','Suppe','Schokoladeneis'],d.essen)}</label>
   <label>Jag gillar${sel('mag',['Computerspiele','Fußball','Tennis','Eishockey','Hallenhockey','Skifahren','Tiere','Reiten','Musik','Gitarre spielen','Klavier spielen'],d.mag)}</label>
   <label>Syskon${sel('gesch',['keine Geschwister','einen Bruder','eine Schwester','einen Bruder und eine Schwester','zwei Brüder','zwei Schwestern','zwei Geschwister','drei Geschwister'],d.gesch)}</label>
  </div>
  <h3>Din text</h3><div class="ex" id="out" style="font-size:1.08rem;line-height:1.7"></div>
  <div class="row">${canSpeak()?'<button class="btn" id="read">🔊 Läs upp</button>':''}</div></div>`;
  $('#bk').onclick=home;
  const gen=()=>{
    const v=id=>$('#'+id).value.trim(); const age=Math.max(0,Math.min(100,parseInt(v('age'))||0));
    const nd={name:v('name'),age,ort:v('ort'),land:v('land'),fach:v('fach'),essen:v('essen'),mag:v('mag'),gesch:v('gesch')}; store.set('steck',nd);
    const g = nd.gesch==='keine Geschwister' ? 'Ich habe keine Geschwister.' : 'Ich habe '+nd.gesch+'.';
    const txt=`Hallo! Ich heiße ${nd.name||'…'}. Ich bin ${age<=100?num(age):age} (${age}) Jahre alt. Ich wohne in ${nd.ort||'…'}. Ich komme aus ${nd.land}. ${g} Mein Lieblingsfach ist ${nd.fach}. Mein Lieblingsessen ist ${nd.essen}. Ich mag ${nd.mag}. Tschüss!`;
    $('#out').textContent=txt; return txt.replace(/\(\d+\) /,'');
  };
  app.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',gen));
  const r=$('#read'); if(r) r.onclick=()=>say(gen());
  gen();
}
