<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kemiquiz 7</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #ffffff;
        --ink: #1c2233;
        --muted: #5d667c;
        --line: #dfe4ee;
        --accent: #4b5bd6;
        --accent-ink: #ffffff;
        --accent-soft: #e8ebfc;
        --ok: #1f8a4c;
        --ok-soft: #e3f5ea;
        --bad: #c23a3a;
        --bad-soft: #fbe7e7;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #13161f;
          --card: #1d2130;
          --ink: #e9ecf5;
          --muted: #a3abc0;
          --line: #323850;
          --accent: #8391ff;
          --accent-ink: #10131c;
          --accent-soft: #2a3052;
          --ok: #5fd18f;
          --ok-soft: #1d3a2a;
          --bad: #ff8a8a;
          --bad-soft: #4a2424;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          17px/1.5 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 20px 16px 60px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 4px 0 2px;
      }
      h2 {
        font-size: 1.2rem;
        margin: 22px 0 10px;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 18px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px;
        margin: 12px 0;
      }
      .cats {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 10px;
      }
      .cat {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        padding: 12px;
        border: 2px solid var(--line);
        border-radius: 12px;
        cursor: pointer;
        background: var(--card);
        user-select: none;
      }
      .cat input {
        margin-top: 4px;
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      .cat.on {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .cat small {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 12px;
        border: 2px solid var(--line);
        background: var(--card);
        color: var(--ink);
        padding: 10px 16px;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .seg button.sel {
        border-color: var(--accent);
        background: var(--accent-soft);
      }
      .bar {
        height: 8px;
        background: var(--line);
        border-radius: 6px;
        overflow: hidden;
        margin: 8px 0 14px;
      }
      .bar > div {
        height: 100%;
        background: var(--accent);
        transition: width 0.3s;
      }
      .meta {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .tag {
        display: inline-block;
        font-size: 0.78rem;
        padding: 2px 10px;
        border-radius: 20px;
        background: var(--accent-soft);
        color: var(--ink);
        margin-bottom: 8px;
      }
      .q {
        font-size: 1.2rem;
        font-weight: 600;
        margin: 4px 0 14px;
      }
      .qimg {
        display: flex;
        justify-content: center;
        margin: 6px 0 14px;
      }
      .qimg svg {
        width: 130px;
        height: 130px;
      }
      .opts {
        display: grid;
        gap: 10px;
      }
      .opts.pics {
        grid-template-columns: repeat(2, 1fr);
      }
      .opt {
        text-align: left;
        padding: 12px 14px;
        width: 100%;
      }
      .opts.pics .opt {
        display: flex;
        justify-content: center;
        padding: 8px;
      }
      .opts.pics .opt svg {
        width: 90px;
        height: 90px;
      }
      .opt:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .opt.ok {
        border-color: var(--ok);
        background: var(--ok-soft);
      }
      .opt.bad {
        border-color: var(--bad);
        background: var(--bad-soft);
      }
      .opt:disabled {
        opacity: 1;
        cursor: default;
      }
      .fb {
        margin-top: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        border-left: 5px solid var(--ok);
        background: var(--ok-soft);
      }
      .fb.bad {
        border-color: var(--bad);
        background: var(--bad-soft);
      }
      .fb b {
        display: block;
        margin-bottom: 2px;
      }
      .big {
        font-size: 2.6rem;
        font-weight: 700;
        margin: 0;
      }
      .res-cat {
        display: flex;
        justify-content: space-between;
        padding: 6px 0;
        border-bottom: 1px solid var(--line);
      }
      .wrong {
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .wrong .a {
        color: var(--ok);
        font-weight: 600;
      }
      .wrong .y {
        color: var(--bad);
      }
      .wrong svg {
        width: 60px;
        height: 60px;
        vertical-align: middle;
      }
      .sheet h3 {
        margin: 16px 0 6px;
        font-size: 1.05rem;
      }
      .sheet ul {
        margin: 0;
        padding-left: 20px;
      }
      .sheet li {
        margin: 3px 0;
      }
      .symgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
      }
      .symgrid div {
        text-align: center;
        font-size: 0.85rem;
      }
      .symgrid svg {
        width: 80px;
        height: 80px;
        display: block;
        margin: 0 auto 4px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      td,
      th {
        border-bottom: 1px solid var(--line);
        padding: 4px 6px;
        text-align: left;
      }
      .hide {
        display: none;
      }
      .note {
        color: var(--muted);
        font-size: 0.85rem;
      }
      kbd {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <!-- START -->
      <section id="start">
        <h1>Kemiquiz 🧪</h1>
        <p class="sub">
          Inför kemiprovet 12.11 · byggt på läsanvisningarna och bokens sidor
        </p>

        <div class="card">
          <h2 style="margin-top: 0">1. Välj områden</h2>
          <div class="cats" id="cats"></div>
          <div class="row" style="margin-top: 12px">
            <button id="allOn">Markera alla</button>
            <button id="allOff">Avmarkera alla</button>
          </div>
        </div>

        <div class="card">
          <h2 style="margin-top: 0">2. Hur många frågor?</h2>
          <div class="row seg" id="nsel">
            <button data-n="10">10</button>
            <button data-n="20" class="sel">20</button>
            <button data-n="40">40</button>
            <button data-n="999">Alla</button>
          </div>
          <div class="row" style="margin-top: 16px">
            <button class="primary" id="go">Starta quiz ▶</button>
            <button id="sheetBtn">📄 Fusklapp</button>
          </div>
          <p class="note" id="poolInfo"></p>
        </div>
      </section>

      <!-- QUIZ -->
      <section id="quiz" class="hide">
        <div class="meta"><span id="qnum"></span><span id="qscore"></span></div>
        <div class="bar"><div id="prog"></div></div>
        <div class="card">
          <span class="tag" id="qtag"></span>
          <div class="q" id="qtext"></div>
          <div class="qimg" id="qimg"></div>
          <div class="opts" id="opts"></div>
          <div id="fb"></div>
          <div
            class="row"
            style="margin-top: 14px; justify-content: space-between"
          >
            <button id="quit">Avsluta</button>
            <button class="primary hide" id="next">Nästa ▶</button>
          </div>
        </div>
        <p class="note">
          Tips: tangenterna <kbd>1</kbd>–<kbd>4</kbd> väljer svar,
          <kbd>Enter</kbd> går vidare.
        </p>
      </section>

      <!-- RESULT -->
      <section id="result" class="hide">
        <div class="card" style="text-align: center">
          <p class="big" id="rscore"></p>
          <p id="rmsg" style="margin: 4px 0 0"></p>
        </div>
        <div class="card">
          <h2 style="margin-top: 0">Per område</h2>
          <div id="rcats"></div>
        </div>
        <div class="card" id="rwrongCard">
          <h2 style="margin-top: 0">Det här blev fel</h2>
          <div id="rwrong"></div>
        </div>
        <div class="row">
          <button class="primary" id="retryWrong">Öva på felen igen</button>
          <button id="again">Ny omgång</button>
          <button id="home">Till start</button>
        </div>
      </section>

      <!-- SHEET -->
      <section id="sheet" class="hide">
        <div class="row" style="justify-content: space-between">
          <h1>Fusklapp</h1>
          <button id="sheetBack">◀ Tillbaka</button>
        </div>
        <div class="card sheet" id="sheetBody"></div>
      </section>
    </div>

    <script>
      /* ---------- Varningssymboler (förenklade bilder) ---------- */
      function starPts(cx, cy, R, r, n) {
        let p = [];
        for (let i = 0; i < n * 2; i++) {
          const a = (Math.PI * i) / n - Math.PI / 2,
            rr = i % 2 ? r : R;
          p.push(
            (cx + rr * Math.cos(a)).toFixed(1) +
              "," +
              (cy + rr * Math.sin(a)).toFixed(1),
          );
        }
        return p.join(" ");
      }
      function burst() {
        let s = '<circle cx="50" cy="58" r="9" stroke="none"/>';
        for (let i = 0; i < 10; i++) {
          const a = (Math.PI * 2 * i) / 10 - Math.PI / 2;
          const x1 = 50 + 13 * Math.cos(a),
            y1 = 58 + 13 * Math.sin(a) * 0.9,
            x2 = 50 + 21 * Math.cos(a),
            y2 = 58 + 21 * Math.sin(a) * 0.9;
          s += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke-width="3" stroke-linecap="round"/>`;
        }
        s +=
          '<rect x="30" y="30" width="5" height="5" stroke="none" transform="rotate(20 32 32)"/><rect x="64" y="31" width="5" height="5" stroke="none" transform="rotate(-25 66 33)"/><rect x="70" y="58" width="4" height="4" stroke="none"/>';
        return s;
      }
      const ICON = {
        explosivt: burst(),
        brandfarligt:
          '<path stroke="none" d="M50 22c3 9 12 14 13 26 1 9-5 18-13 18s-14-7-13-15c1-7 5-9 6-15 3 4 3 7 6 8 1-7-2-14 1-22z"/><rect x="33" y="69" width="34" height="4" stroke="none"/>',
        oxiderande:
          '<circle cx="50" cy="61" r="8.5" fill="none" stroke-width="4"/><path stroke="none" d="M50 22c2 6 9 10 9 18 0 4-2 7-4 9 0-4-2-6-5-8-3 2-5 4-5 8-2-2-4-5-4-9 0-6 5-9 6-13 1 2 2 3 3 4 1-3 1-6 0-9z"/><rect x="33" y="72" width="34" height="4" stroke="none"/>',
        gas: '<rect x="27" y="50" width="40" height="17" rx="8.5" stroke="none"/><rect x="66" y="54" width="7" height="9" stroke="none"/><rect x="73" y="51" width="3" height="15" stroke="none"/>',
        fratande:
          '<g transform="rotate(-35 37 32)"><rect x="33" y="20" width="8" height="20" rx="2" fill="none" stroke-width="2.5"/></g><g transform="rotate(35 63 32)"><rect x="59" y="20" width="8" height="20" rx="2" fill="none" stroke-width="2.5"/></g><circle cx="43" cy="49" r="1.8" stroke="none"/><circle cx="43" cy="56" r="1.8" stroke="none"/><circle cx="57" cy="49" r="1.8" stroke="none"/><circle cx="57" cy="56" r="1.8" stroke="none"/><path stroke="none" d="M27 64h20v10H27zM40 64l3-3 2 3z" /><path stroke="none" d="M53 74v-6l4-3v-4h3v4h3v-6h3v6h3v9z"/><rect x="26" y="75" width="48" height="2.5" stroke="none"/>',
        giftigt:
          '<circle cx="50" cy="40" r="12" stroke="none"/><rect x="43" y="46" width="14" height="10" rx="2" stroke="none"/><circle cx="45" cy="39" r="3.2" fill="#fff" stroke="none"/><circle cx="55" cy="39" r="3.2" fill="#fff" stroke="none"/><path d="M50 44l-2 4h4z" fill="#fff" stroke="none"/><path d="M33 59l34 13M67 59L33 72" stroke-width="5" stroke-linecap="round"/>',
        skadligt:
          '<rect x="45" y="25" width="10" height="33" rx="3" stroke="none"/><circle cx="50" cy="68" r="5.5" stroke="none"/>',
        halsofarligt:
          '<circle cx="50" cy="29" r="6.5" stroke="none"/><path stroke="none" d="M35 75V50c0-7 4-11 10-11h10c6 0 10 4 10 11v25z"/><polygon fill="#fff" stroke="none" points="' +
          starPts(50, 57, 10, 4, 8) +
          '"/>',
        miljo:
          '<path d="M36 73V40M36 50l-9-8M36 46l8-10M36 59l6-5" stroke-width="3" fill="none" stroke-linecap="round"/><path stroke="none" d="M50 66c4-5 12-5 16 0-4 5-12 5-16 0zM65 66l7-5v10z"/><circle cx="54" cy="64.5" r="1.3" fill="#fff" stroke="none"/><rect x="26" y="74" width="48" height="3" stroke="none"/>',
      };
      function pic(k) {
        return `<svg viewBox="0 0 100 100" role="img" aria-label="varningssymbol"><polygon points="50,5 95,50 50,95 5,50" fill="#fff" stroke="#e30613" stroke-width="7" stroke-linejoin="miter"/><g fill="#000" stroke="#000">${ICON[k]}</g></svg>`;
      }
      const SYMS = [
        {
          k: "explosivt",
          n: "Explosivt",
          d: "kan explodera, t.ex. av värme, stötar eller gnistor",
        },
        {
          k: "brandfarligt",
          n: "Lättantändligt",
          d: "brinner lätt – ska hållas borta från värme och öppen eld",
        },
        {
          k: "oxiderande",
          n: "Oxiderande",
          d: "ger ifrån sig syre och kan få andra ämnen att brinna kraftigare",
        },
        {
          k: "gas",
          n: "Gas under tryck",
          d: "behållaren innehåller gas under tryck och kan explodera om den värms upp",
        },
        {
          k: "fratande",
          n: "Frätande",
          d: "kan ge frätskador på hud och ögon och fräta på metall",
        },
        {
          k: "giftigt",
          n: "Giftigt",
          d: "kan vara dödligt även i små mängder",
        },
        {
          k: "skadligt",
          n: "Irriterande / skadligt",
          d: "kan irritera hud, ögon eller luftvägar",
        },
        {
          k: "halsofarligt",
          n: "Hälsofarligt",
          d: "kan ge allvarliga skador på sikt, t.ex. på lungor eller orsaka cancer",
        },
        {
          k: "miljo",
          n: "Miljöfarligt",
          d: "skadligt för djur och natur, särskilt i vatten",
        },
      ];

      /* ---------- Kategorier ---------- */
      const CATS = {
        sym: { n: "Varningssymboler & säkerhet", s: "sid 18" },
        bland: { n: "Blandningar & rena ämnen", s: "kap 4" },
        sep: { n: "Separationsmetoder", s: "kap 5 + häftet" },
        grund: { n: "Grundämnen, föreningar, molekyler", s: "kap 6" },
        tecken: { n: "Kemiska tecken", s: "grundämnenas symboler" },
        formel: { n: "Formelskrivning", s: "kemispråk" },
        reak: { n: "Kemiska reaktioner", s: "häftet + sid 65" },
        forbr: { n: "Förbränning & brandsäkerhet", s: "kap 12" },
      };

      /* ---------- Frågor: a[0] är rätt svar ---------- */
      const Q = [];
      function add(c, q, a, e, img) {
        Q.push({ c, q, a, e, img });
      }

      /* Varningssymboler */
      SYMS.forEach((s) => {
        add(
          "sym",
          "Vad betyder den här varningssymbolen?",
          [
            s.n,
            ...SYMS.filter((x) => x !== s)
              .sort(() => Math.random() - 0.5)
              .slice(0, 3)
              .map((x) => x.n),
          ],
          `${s.n}: ${s.d}.`,
          pic(s.k),
        );
        add(
          "sym",
          `Vilken symbol betyder att ämnet är <i>${s.n.toLowerCase()}</i>?`,
          null,
          `${s.n}: ${s.d}.`,
          null,
        );
        Q[Q.length - 1].picOpts = s.k;
      });
      add(
        "sym",
        "Vilken form och färg har varningssymbolerna?",
        [
          "Vit romb (kvadrat på spetsen) med röd kant och svart bild",
          "Gul triangel med svart kant",
          "Röd cirkel med vit bild",
          "Blå fyrkant med vit bild",
        ],
        "Varningssymbolerna är vita romber med röd ram och en svart bild.",
      );
      add(
        "sym",
        "Vilken varningssymbol ska lättantändliga ämnen, t.ex. bensin, vara märkta med?",
        [
          "Lättantändligt (flamman)",
          "Frätande",
          "Miljöfarligt",
          "Gas under tryck",
        ],
        "Boken (sid 80): lättantändliga ämnen måste märkas med en varningssymbol – flamman.",
      );

      add(
        "sym",
        "Vad berättar varningssymbolerna på en förpackning?",
        [
          "Om ämnet är t.ex. skadligt, hälsofarligt, giftigt, lättantändligt eller frätande",
          "Hur mycket ämnet kostar",
          "Vilket land ämnet kommer ifrån",
          "Hur ämnet smakar",
        ],
        "Boken sid 18: varningssymbolerna berättar om det kemiska ämnet är skadligt, hälsofarligt eller giftigt, och det finns symboler för lättantändliga och frätande ämnen.",
      );
      add(
        "sym",
        "Gäller varningssymbolerna bara i Finland/Sverige?",
        [
          "Nej, de är gemensamma internationella symboler",
          "Ja, varje land har egna",
          "Bara i skolan",
          "Bara i EU:s labb",
        ],
        "Man har kommit överens om gemensamma, internationella varningssymboler för kemikalier.",
      );
      add(
        "sym",
        "Vad gäller i kemisalen?",
        [
          "Man får inte äta eller dricka, och man tvättar händerna när man går ut",
          "Man får äta om man är försiktig",
          "Man behöver aldrig tvätta händerna",
          "Man får smaka på ämnena",
        ],
        "Boken: du får inte äta eller dricka i kemisalen. Kom ihåg att tvätta händerna när du går ut ur rummet.",
      );
      add(
        "sym",
        "Hur gör man sig av med farliga kemikalier?",
        [
          "De samlas upp, sorteras och förs till en uppsamlingsstation för farligt avfall",
          "Man häller alltid ut dem i avloppet",
          "Man slänger dem i blandavfallet",
          "Man bränner upp dem",
        ],
        "Vissa kemikalier kan spolas ner eller slängas i blandavfallet, men andra måste samlas upp och föras till en uppsamlingsstation för farligt avfall.",
      );
      add(
        "sym",
        "Du bränner handen i labbet. Vad gör du först?",
        [
          "Håller handen under kallt rinnande vatten så fort som möjligt",
          "Sätter på ett plåster direkt",
          "Smörjer in med fett",
          "Väntar och ser om det går över",
        ],
        "Boken sid 18: får du en brännskada på handen ska du så fort som möjligt sätta handen under kallt och rinnande vatten.",
      );
      add(
        "sym",
        "Vad används en nödbrytare (nödstopp) till?",
        [
          "Att snabbt slå av strömmen",
          "Att släcka eld med vatten",
          "Att larma brandkåren",
          "Att starta ventilationen",
        ],
        "Med en nödbrytare går det fort att slå av strömmen.",
      );

      /* Kap 4: Blandningar & rena ämnen */
      add(
        "bland",
        "Vilka två grupper kan vi dela in ämnen i?",
        [
          "Rena ämnen och blandningar",
          "Metaller och gaser",
          "Fasta och flytande",
          "Syror och baser",
        ],
        "Alla ämnen är antingen rena ämnen eller blandningar.",
      );
      add(
        "bland",
        "Vad är ett <b>rent ämne</b>?",
        [
          "Ett ämne där alla partiklar är likadana – det innehåller bara ett enda ämne",
          "Ett ämne som är helt fritt från bakterier",
          "Ett ämne som är genomskinligt",
          "Ett ämne som har blandats med vatten",
        ],
        'I ett rent ämne är alla partiklar likadana. "Rent" i kemin betyder bara ett ämne – inte att det är fritt från smuts eller bakterier.',
      );
      add(
        "bland",
        "Rena ämnen är antingen …",
        [
          "grundämnen eller föreningar",
          "lösningar eller emulsioner",
          "metaller eller legeringar",
          "homogena eller heterogena",
        ],
        "Rena ämnen är antingen grundämnen eller (kemiska) föreningar.",
      );
      add(
        "bland",
        "Vad är en <b>blandning</b>?",
        [
          "Minst två rena ämnen som blandats",

      /* ---------- Logik ---------- */
      const $ = (id) => document.getElementById(id);
      const shuffle = (a) => {
        a = a.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      };
      let sel = new Set(Object.keys(CATS)),
        N = 20,
        run = null;

      function renderCats() {
        const box = $("cats");
        box.innerHTML = "";
        for (const k in CATS) {
          const cnt = Q.filter((q) => q.c === k).length;
          const lab = document.createElement("label");
          lab.className = "cat" + (sel.has(k) ? " on" : "");
          lab.innerHTML = `<input type="checkbox" ${sel.has(k) ? "checked" : ""}><span><b>${CATS[k].n}</b><small>${CATS[k].s} · ${cnt} frågor</small></span>`;
          lab.querySelector("input").onchange = (e) => {
            e.target.checked ? sel.add(k) : sel.delete(k);
            renderCats();
          };
          box.appendChild(lab);
        }
        const tot = Q.filter((q) => sel.has(q.c)).length;
        $("poolInfo").textContent = `${tot} frågor i de valda områdena.`;
        $("go").disabled = !tot;
      }
      document.querySelectorAll("#nsel button").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll("#nsel button")
              .forEach((x) => x.classList.remove("sel"));
            b.classList.add("sel");
            N = +b.dataset.n;
          }),
      );
      $("allOn").onclick = () => {
        sel = new Set(Object.keys(CATS));
        renderCats();
      };
      $("allOff").onclick = () => {
        sel = new Set();
        renderCats();
      };

      function show(id) {
        ["start", "quiz", "result", "sheet"].forEach((s) =>
          $(s).classList.toggle("hide", s !== id),
        );
        window.scrollTo(0, 0);
      }

      function build(list) {
        // jämn fördelning mellan områden
        const by = {};
        shuffle(list).forEach((q) => (by[q.c] = by[q.c] || []).push(q));
        const keys = shuffle(Object.keys(by));
        const out = [];
        while (out.length < Math.min(N, list.length)) {
          for (const k of keys) {
            if (by[k].length && out.length < N) out.push(by[k].pop());
          }
          if (keys.every((k) => !by[k].length)) break;
        }
        return shuffle(out);
      }
      function prep(q) {
        if (q.picOpts) {
          const others = shuffle(SYMS.filter((s) => s.k !== q.picOpts)).slice(
            0,
            3,
          );
          const opts = shuffle([
            { h: pic(q.picOpts), ok: true },
            ...others.map((s) => ({ h: pic(s.k), ok: false, lab: s.n })),
          ]);
          return { ...q, opts, pics: true };
        }
        return { ...q, opts: shuffle(q.a.map((h, i) => ({ h, ok: i === 0 }))) };
      }
      function start(list) {
        run = { qs: build(list).map(prep), i: 0, score: 0, wrong: [], per: {} };
        show("quiz");
        ask();
      }
      function ask() {
        const q = run.qs[run.i];
        run.answered = false;
        $("qnum").textContent = `Fråga ${run.i + 1} av ${run.qs.length}`;
        $("qscore").textContent = `Rätt: ${run.score}`;
        $("prog").style.width = (run.i / run.qs.length) * 100 + "%";
        $("qtag").textContent = CATS[q.c].n;
        $("qtext").innerHTML = q.q;
        $("qimg").innerHTML = q.img || "";
        $("qimg").classList.toggle("hide", !q.img);
        const o = $("opts");
        o.innerHTML = "";
        o.classList.toggle("pics", !!q.pics);
        q.opts.forEach((op, i) => {
          const b = document.createElement("button");
          b.className = "opt";
          b.innerHTML = q.pics ? op.h : `<b>${i + 1}.</b> ${op.h}`;
          b.onclick = () => answer(i);
          o.appendChild(b);
        });
        $("fb").innerHTML = "";
        $("next").classList.add("hide");
      }
      function answer(i) {
        if (run.answered) return;
        run.answered = true;
        const q = run.qs[run.i],
          btns = [...document.querySelectorAll("#opts .opt")];
        const ok = q.opts[i].ok;
        btns.forEach((b, j) => {
          b.disabled = true;
          if (q.opts[j].ok) b.classList.add("ok");
          else if (j === i) b.classList.add("bad");
        });
        const p = (run.per[q.c] = run.per[q.c] || { r: 0, t: 0 });
        p.t++;
        if (ok) {
          run.score++;
          p.r++;
        } else run.wrong.push({ q, y: q.opts[i] });
        $("fb").innerHTML =
          `<div class="fb ${ok ? "" : "bad"}"><b>${ok ? "✅ Rätt!" : "❌ Inte riktigt."}</b>${q.e}</div>`;
        $("qscore").textContent = `Rätt: ${run.score}`;
        const n = $("next");
        n.classList.remove("hide");
        n.textContent = run.i + 1 < run.qs.length ? "Nästa ▶" : "Se resultat ▶";
        n.focus();
      }
      $("next").onclick = () => {
        run.i++;
        run.i < run.qs.length ? ask() : results();
      };
      $("quit").onclick = () => {
        run.qs.length = Math.max(run.i + (run.answered ? 1 : 0), 0);
        run.qs.length ? results() : show("start");
      };
      document.addEventListener("keydown", (e) => {
        if ($("quiz").classList.contains("hide")) return;
        if (/^[1-4]$/.test(e.key) && !run.answered) {
          const b = document.querySelectorAll("#opts .opt")[+e.key - 1];
          if (b) b.click();
        } else if (e.key === "Enter" && run.answered) {
          e.preventDefault();
          $("next").click();
        }
      });
      function results() {
        const t = run.qs.length,
          pct = Math.round((run.score / t) * 100);
        $("rscore").textContent = `${run.score} / ${t}`;
        $("rmsg").textContent =
          pct >= 90
            ? "🏆 Superbra! Du är redo för provet."
            : pct >= 70
              ? "👍 Bra jobbat! Repetera felen nedan."
              : pct >= 50
                ? "💪 På god väg – öva på felen och kör igen."
                : "📚 Läs fusklappen och försök igen – det blir bättre för varje gång!";
        $("rcats").innerHTML = Object.entries(run.per)
          .map(
            ([k, p]) =>
              `<div class="res-cat"><span>${CATS[k].n}</span><b>${p.r}/${p.t}</b></div>`,
          )
          .join("");
        $("rwrongCard").classList.toggle("hide", !run.wrong.length);
        $("rwrong").innerHTML = run.wrong
          .map((w) => {
            const right = w.q.opts.find((o) => o.ok);
            return `<div class="wrong"><div>${w.q.q}${w.q.img ? "<br>" + w.q.img : ""}</div><div class="y">Ditt svar: ${w.y.h}</div><div class="a">Rätt: ${right.h}</div><div class="note">${w.q.e}</div></div>`;
          })
          .join("");
        $("retryWrong").classList.toggle("hide", !run.wrong.length);
        show("result");
      }
      $("go").onclick = () => start(Q.filter((q) => sel.has(q.c)));
      $("again").onclick = () => start(Q.filter((q) => sel.has(q.c)));
      $("retryWrong").onclick = () => {
        const w = run.wrong
          .map((x) =>
            Q.find(
              (q) =>
                q.q === x.q.q &&
                q.c === x.q.c &&
                q.img === x.q.img &&
                q.picOpts === x.q.picOpts,
            ),
          )
          .filter(Boolean);
        const keep = N;
        N = 999;
        start(w);
        N = keep;
      };
      $("home").onclick = () => show("start");

      /* ---------- Fusklapp ---------- */
      $("sheetBody").innerHTML = `
<h3>⚠️ Varningssymboler</h3>
<div class="symgrid">${SYMS.map((s) => `<div>${pic(s.k)}<b>${s.n}</b><br>${s.d}</div>`).join("")}</div>

<ul><li>Varningssymbolerna är gemensamma och internationella och berättar om ett ämne är skadligt, hälsofarligt, giftigt, lättantändligt eller frätande.</li><li>Ät och drick aldrig i kemisalen. Tvätta händerna när du går ut.</li><li>Vissa kemikalier måste samlas upp och föras till en uppsamlingsstation för farligt avfall.</li><li>Brännskada: kallt rinnande vatten så fort som möjligt. Nödbrytaren slår snabbt av strömmen.</li></ul>

<h3>🥤 Blandningar och rena ämnen (kap 4)</h3>
<ul>
<li><b>Rent ämne</b>: alla partiklar likadana. Antingen <b>grundämne</b> eller <b>förening</b>. Har exakt smält- och kokpunkt.</li>
<li><b>Blandning</b>: minst två rena ämnen.</li>
<li><b>Homogen</b> blandning: lika helt igenom (lösningar, gasblandningar t.ex. luft, legeringar t.ex. stål och mässing, saft).</li>
<li><b>Heterogen</b> blandning: man ser delarna. Rök (fast i gas), dimma (vätska i gas), slam (fast i vätska), skum (gas i vätska), emulsion (två vätskor som inte löser sig, t.ex. mjölk), gel.</li>
<li><b>Lösning</b> = lösningsmedel + löst ämne.</li>
</ul>

<h3>⚗️ Separationsmetoder (kap 5)</h3>
<table>
<tr><th>Metod</th><th>Bygger på</th><th>Används när …</th></tr>
<tr><td>Filtrering</td><td>partikelstorlek</td><td>fast ämne (ej löst) ska bort ur vätska/gas – sand från vatten</td></tr>
<tr><td>Dekantering</td><td>fast ämne sjunker</td><td>häll av vätskan – kokkaffe</td></tr>
<tr><td>Extraktion</td><td>löslighet</td><td>lösa ut vissa ämnen – te, kaffe, salt ur sand</td></tr>
<tr><td>Indunstning</td><td>vätskan avdunstar</td><td>få tillbaka löst fast ämne – salt ur saltvatten</td></tr>
<tr><td>Destillation</td><td>olika kokpunkt</td><td>få ren vätska – rent vatten ur havsvatten, alkohol, oljeraffinering</td></tr>
</table>
<p><b>Sand + salt:</b> lös i vatten → filtrera (sanden i filtret) → indunsta filtratet (saltet blir kvar).</p>

<h3>⚛️ Grundämnen och föreningar (kap 6)</h3>
<ul>
<li><b>Atom</b> = minsta byggstenen. <b>Grundämne</b> = bara en sorts atomer (118 kända, 91 i naturen).</li>
<li><b>Förening</b> = minst två olika grundämnen kemiskt bundna (H₂O, CO₂, NaCl).</li>
<li><b>Molekyl</b> = minst två atomer bundna ihop (O₂, H₂O).</li>
<li><b>Kemisk formel</b> = ämnet skrivet med kemiska tecken, visar vilka och hur många atomer.</li>
<li>Metaller, icke-metaller, halvmetaller (kisel). Kvicksilver = enda flytande metallen.</li>
</ul>

<h3>✍️ Formelskrivning</h3>
<table>

<h3>🔥 Kemiska reaktioner och förbränning</h3>
<ul>
<li><b>Kemisk reaktion</b>: nya ämnen bildas. Bindningar bryts och nya bildas, atomerna försvinner inte.</li>
<li>järn + svavel → järnsulfid &nbsp; <b>Fe + S → FeS</b> (blandningen kan separeras med magnet, föreningen inte)</li>
<li><b>Förbränning</b> = reaktion med syre → <b>oxider</b>. Energi frigörs.</li>
<li>magnesium + syre → magnesiumoxid &nbsp; <b>2Mg + O₂ → 2MgO</b> (bländande vitt ljus, vitt pulver)</li>
<li>järn (stålull) + syre → järnoxid (blir tyngre!)</li>
<li>stearin/trä + syre → koldioxid + vatten (för lite syre → kolmonoxid och sot)</li>
<li><b>Eldens tre förutsättningar</b>: brännbart ämne, syre, tillräckligt hög temperatur.</li>
<li><b>Släcka</b>: ta bort bränslet, kyla (vatten), kväva (brandfilt, lock). Aldrig vatten på fett, bensin eller el – använd brandfilt, koldioxid- eller pulversläckare. Ring 112.</li>
<li><b>Antändningstemperatur</b>: lägsta temp då ämnet börjar brinna. <b>Flampunkt</b>: lägsta temp då ångorna från en vätska börjar brinna.</li>
</ul>`;
