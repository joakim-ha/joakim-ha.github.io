<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geografiprovet</title>
<style>
:root{
  --bg:#f6f4ee; --card:#ffffff; --ink:#1f2a2e; --muted:#5d6b70; --line:#e2ddd2;
  --accent:#1f6f8b; --accent-ink:#ffffff; --accent-soft:#e3f0f4;
  --ok:#2e7d4f; --ok-soft:#e3f3e8; --bad:#b3412f; --bad-soft:#f8e4df;
  --k1:#1f6f8b; --k2:#7a4fa3; --k6:#b0662a;
  --grid:#d9d3c5; --eq:#c0392b; --mer:#2f6fd0; --special:#8a7d5c;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a1c; --card:#1d2528; --ink:#e7ecec; --muted:#9aa8ab; --line:#2f3a3d;
    --accent:#4fb0d0; --accent-ink:#0e1517; --accent-soft:#1e3640;
    --ok:#5cc28a; --ok-soft:#1d3527; --bad:#ef7a66; --bad-soft:#3d2420;
    --k1:#4fb0d0; --k2:#b48be0; --k6:#e39b5c;
    --grid:#34413f; --eq:#ef6b5a; --mer:#6ea3f0; --special:#b8a878;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#141a1c; --card:#1d2528; --ink:#e7ecec; --muted:#9aa8ab; --line:#2f3a3d;
    --accent:#4fb0d0; --accent-ink:#0e1517; --accent-soft:#1e3640;
    --ok:#5cc28a; --ok-soft:#1d3527; --bad:#ef7a66; --bad-soft:#3d2420;
    --k1:#4fb0d0; --k2:#b48be0; --k6:#e39b5c;
    --grid:#34413f; --eq:#ef6b5a; --mer:#6ea3f0; --special:#b8a878;
    --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 16px}
header h1{font-size:1.35rem;margin:0;letter-spacing:-.01em}
header h1 small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.iconbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:.92rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.mode{padding:12px;min-height:0}.mode b{font-size:.98rem}.mode span{font-size:.82rem}}
.mode{display:block;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:16px;box-shadow:var(--shadow);min-height:108px}
.mode b{display:block;font-size:1.05rem;margin-bottom:4px}
.mode span{color:var(--muted);font-size:.9rem}
.mode .ic{font-size:1.4rem;display:block;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.stats{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0 0;color:var(--muted);font-size:.9rem}
.stats b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:0 0 16px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;vertical-align:middle}
.tag.k1{background:var(--k1)} .tag.k2{background:var(--k2)} .tag.k6{background:var(--k6)}
:root[data-theme="dark"] .tag, :root:not([data-theme="light"]) .tag{color:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag{color:#111}}
:root[data-theme="dark"] .tag{color:#111}
.q{font-size:1.2rem;font-weight:650;margin:8px 0 16px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:700;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;padding:14px;border-radius:12px;border-left:4px solid var(--accent);background:var(--accent-soft)}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb h3{margin:0 0 4px;font-size:1rem}
.fb p{margin:0}
.src{display:block;margin-top:6px;font-size:.82rem;color:var(--muted)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--accent)}
.flip{perspective:1200px;cursor:pointer;user-select:none}
.flip .in{position:relative;min-height:240px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;border-radius:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
.face.back{transform:rotateY(180deg)}
.face .term{font-size:1.6rem;font-weight:750}
.face .def{font-size:1.1rem}
.face .hint{position:absolute;bottom:10px;font-size:.8rem;color:var(--muted)}
.big{font-size:2.6rem;font-weight:800;margin:4px 0}
.center{text-align:center}
.list{margin:0;padding-left:20px}
.list li{margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev:first-child{border-top:0}
.rev .mark{font-weight:800;margin-right:6px}
.rev .mark.ok{color:var(--ok)} .rev .mark.bad{color:var(--bad)}
.muted{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
.seg button{border:0;background:var(--card);padding:8px 12px;font-weight:600;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
svg.map{width:100%;background:var(--bg);height:auto;display:block;background:var(--bg);border-radius:12px;border:1px solid var(--line);touch-action:manipulation}
svg.map text{font:600 10px system-ui,sans-serif;fill:var(--muted)}
svg.map .gl{stroke:var(--grid);stroke-width:.4}
svg.map .g2{stroke-width:.9}
svg.map .eq{stroke:var(--eq);stroke-width:1.6}
svg.map .mer{stroke:var(--mer);stroke-width:1.6}
svg.map .sp{stroke:var(--special);stroke-width:.9;stroke-dasharray:4 3}
svg.map .lbl{font-size:8px;fill:var(--special)}
svg.map .hk{fill:var(--muted);font-size:7px;letter-spacing:.04em}
svg.map .dot{fill:var(--ink)}
svg.map .hit{fill:transparent;cursor:crosshair}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);margin:8px 0 0}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:4px;border-radius:2px}
.sum h2{margin:0 0 2px;font-size:1.15rem}
.sum{margin-bottom:14px}
.sum .src{margin:0 0 8px}
footer{margin-top:28px;color:var(--muted);font-size:.8rem;text-align:center}
@media (max-width:480px){.q{font-size:1.08rem}.wrap{padding:12px 16px 48px}.face .term{font-size:1.35rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Geografiprovet<small>Kartor · Himlakroppen jorden · Stenplaneten</small></h1>
  <button class="iconbtn" id="themeBtn" aria-label="Byt färgtema">🌓 Tema</button>
</header>
<main id="app"></main>
<footer>Frågorna bygger på boken (s. 9–13, 16–23, 66–70, 72–75) och anteckningarna i häftet. Fungerar utan internet.</footer>
</div>
<script>
// Kapitel: k1 = Kartor och gradnät, k2 = Himlakroppen jorden, k6 = Stenplaneten
// Flerval: [kapitel, fråga, rätt svar, [fel svar], förklaring, källa]
const MC = [
// ---------- KAPITEL 1 ----------
["k1","Vad är en karta?","En förenklad och förminskad bild av en plats eller ett område",["En exakt kopia av verkligheten i samma storlek","En bok med en samling kartor","Ett fotografi taget från en satellit"],"En karta är en avskalad (förenklad) och förminskad avbildning av en plats eller ett område.","Boken s. 9 + häftet"],
["k1","Vad är en atlas?","En bok med en samling kartor",["En karta över hela världen","En jordglob","En sorts kompass"],"En atlas är en bok med en samling kartor.","Häftet"],
["k1","Vad anger kartans skala?","I vilken grad kartan är förminskad i förhållande till verkligheten",["Vilka färger kartan använder","Åt vilket håll norr ligger","Hur gammal kartan är"],"Skalan anger hur mycket kartan är förminskad jämfört med verkligheten.","Boken s. 9 + häftet"],
["k1","Vad är karttecken?","Linjer, punkter eller figurer som visar vad som finns på kartan",["Kartans rubrik","Siffrorna i gradnätet","Namnet på den som gjort kartan"],"Det som visas på kartan märks ut med karttecken, t.ex. linjer, punkter eller figurer i olika former och storlekar.","Boken s. 9 + häftet"],
["k1","Vad gör teckenförklaringen?","Den förklarar vad karttecknen, figurerna och färgerna betyder",["Den visar åt vilket håll norr ligger","Den anger kartans skala","Den talar om var på jorden kartan ligger"],"Teckenförklaringen finns i anslutning till kartan och förklarar vad karttecknen betyder.","Boken s. 9, 12 + häftet"],
["k1","Vad betyder skalan 1:10 000?","1 cm på kartan motsvarar 100 m i verkligheten",["1 cm på kartan motsvarar 10 km i verkligheten","1 cm på kartan motsvarar 10 m i verkligheten","1 cm på kartan motsvarar 1 km i verkligheten"],"1:10 000 betyder att 1 cm på kartan = 10 000 cm i verkligheten. 10 000 cm = 100 m.","Boken s. 12"],
["k1","Vad betyder det om det står 1:40 000 på en karta?","1 cm på kartan motsvarar 400 m i verkligheten",["1 cm på kartan motsvarar 40 m i verkligheten","1 cm på kartan motsvarar 4 km i verkligheten","1 cm på kartan motsvarar 40 km i verkligheten"],"1 cm = 40 000 cm i verkligheten. 40 000 cm = 400 m.","Häftet (frågor kap 1, nr 14)"],
["k1","Vad är bra med en skalstock?","Sträckan förblir i rätt längd även om du förstorar eller förminskar kartan",["Den visar åt vilket håll norr ligger","Den visar hur högt över havet ett område ligger","Den förklarar vad färgerna betyder"],"Skalstocken visar direkt i vilken proportion avstånden avbildats. Oavsett om du förminskar eller förstorar kartan kommer sträckan att förbli i rätt längd.","Boken s. 12"],
["k1","Vad brukar grönt betyda på en terrängkarta (referenskarta)?","Lågland eller en geografisk depression",["Skog","Höga berg","Sjöar och hav"],"På terrängkartor (referenskartor) används grönt för lågland eller geografisk depression. På en vegetationskarta betyder grönt oftast skog. Samma färg kan alltså betyda olika saker på olika kartor!","Boken s. 9"],
["k1","Vad symboliserar grönt oftast på en vegetationskarta?","Skog",["Lågland","Motorvägar","Geografiska depressioner"],"På en vegetationskarta symboliserar grönt oftast skog, medan grönt på en terrängkarta betyder lågland.","Boken s. 9"],
["k1","Hur är motorvägar oftast utmärkta på en vägkarta?","Med tjocka linjer",["Med tunna linjer","Med gröna punkter","Med streckade blå linjer"],"På vägkartor är motorvägar utmärkta med tjocka linjer, mindre vägar med tunnare linjer.","Boken s. 9"],
["k1","Vilken sorts karta använder man för att till exempel visa folktätheten i Europa?","En temakarta (tematisk karta)",["En terrängkarta","En guidekarta","Ett sjökort"],"Med en temakarta kan man åskådliggöra ett visst tema, till exempel folktätheten i Europa.","Boken s. 9"],
["k1","Vilken karta är oumbärlig när du rör dig i naturen?","Terrängkarta",["Temakarta","Politisk karta","Historisk karta"],"En terrängkarta är oumbärlig när du rör dig i naturen, t.ex. i Noux nationalpark.","Boken s. 9"],
["k1","Vad är Carta Marina?","En historisk karta från år 1539 gjord av Olaus Magnus",["En digital karttjänst på internet","En satellitbild av Norden","Ett sjökort över Stilla havet"],"Carta Marina är en historisk karta från år 1539, gjord av Olaus Magnus.","Boken s. 9"],
["k1","Vad kallas regional och platsbunden information med ett annat ord?","Geodata (geografisk information)",["Karttecken","Kartprojektion","Teckenförklaring"],"Regional och platsbunden information kallas geografisk information eller geodata och kan visualiseras med kartor.","Boken s. 9"],
["k1","Varför är alla kartor generaliseringar av verkligheten?","Det är omöjligt att rita alla detaljer i terrängen på en karta",["Kartritare vill dölja hemliga platser","Satelliter kan inte fotografera detaljer","Det är förbjudet att rita exakta kartor"],"Alla kartor är generaliseringar eftersom det är omöjligt att rita alla detaljer i terrängen på en karta.","Boken s. 9"],
["k1","Vilket av följande är ett sätt att samla in information för att skapa kartor?","Satellitbilder och fotografier tagna från flygplan",["Teckenförklaringar","Kompassrosor","Skalstockar"],"Man använder satelliter och flygplan. Bilderna kompletteras med mätningar i terrängen och information från andra källor, som statistik och intervjuer.","Boken s. 10"],
["k1","Vad är en fördel med digitala kartor jämfört med papperskartor?","De innehåller mer information och är lättare att uppdatera",["De är alltid helt verklighetstrogna","De behöver ingen skala","De visar inga detaljer"],"Digitala kartor innehåller mer information och är lättare att uppdatera än traditionella papperskartor. De kan också hitta bästa rutten.","Boken s. 10"],
["k1","Vad visar satellitbilderna från Iguazú från 1973 och 2011?","Att stora delar av regnskogen har röjts till odlingsmark",["Att en ny vulkan har bildats","Att havsnivån har sjunkit","Att en stad har byggts i nationalparken"],"I nationalparken Iguazú (gränsar till Argentina, Brasilien och Paraguay) har stora delar av regnskogen röjts till odlingsmark. Förändringen syns på satellitbilderna.","Boken s. 10"],
["k1","Varför är världskartor aldrig helt verklighetstrogna?","Det går inte att trycka ut jordklotets yta på en plan yta utan att töja ut eller söndra den",["Jorden är för stor för att fotograferas","Kartritarna gör alltid fel","Haven rör sig hela tiden"],"Världskartor är tvådimensionella avbildningar av det tredimensionella jordklotet. Ytan kan inte plattas ut utan att töjas eller gå sönder.","Boken s. 10–11"],
["k1","Var är ytor, avstånd och vinklar alla korrekta?","Bara på en jordglob",["På alla världskartor","På digitala kartor","På terrängkartor"],"Det är bara på en jordglob som ytor, avstånd och vinklar är korrekta.","Boken s. 11"],
["k1","Vad är en kartprojektion?","Ett sätt att avbilda jordklotet på en plan yta",["En karta som projiceras på en vägg","En lista med karttecken","En karta från 1500-talet"],"Kartprojektioner gör det möjligt att avbilda jordklotet på en plan yta. En del förvränger ytor, andra avstånd eller vinklar.","Boken s. 11"],
["k1","Hur stor del av jordklotets yta består av vatten?","71 %",["50 %","61 %","81 %"],"71 % av jordklotets yta består av vatten.","Boken s. 11"],
["k1","Vilket är världens största ocean?","Stilla havet",["Atlanten","Indiska oceanen","Ishavet"],"Stilla havet (165,3 milj. km²) sträcker sig över mer än en tredjedel av jordytan.","Boken s. 11"],
["k1","Vilket av de fem stora haven är minst?","Ishavet",["Antarktiska oceanen","Indiska oceanen","Atlanten"],"Ishavet är 14,1 milj. km². Antarktiska oceanen 20,3, Indiska oceanen 73,6, Atlanten 106,4 och Stilla havet 165,3 milj. km².","Boken s. 11"],
["k1","Vilken världsdel är störst?","Asien",["Afrika","Nordamerika","Antarktis"],"Asien är 44,6 milj. km². Afrika kommer därefter med 30,1 milj. km².","Boken s. 11"],
["k1","Vilken världsdel är minst?","Australien och Oceanien",["Europa","Antarktis","Sydamerika"],"Australien och Oceanien är 9,0 milj. km², Europa 10,2 milj. km².","Boken s. 11"],
["k1","Hur många världsdelar finns det?","Sju",["Fem","Sex","Åtta"],"Det finns sju världsdelar: Europa, Asien, Afrika, Nordamerika, Sydamerika, Australien och Oceanien samt Antarktis.","Boken s. 11 + häftet"],
["k1","Vad heter kontinenten som vi bor på?","Eurasien",["Europa","Skandinavien","Pangea"],"Europa och Asien utgör tillsammans kontinenten Eurasien.","Boken s. 11 + häftet"],
["k1","Hur högt är Mount Everest enligt boken?","8 850 m",["6 961 m","10 994 m","4 810 m"],"Mount Everest är 8 850 m. Marianergraven är 10 994 m djup.","Boken s. 11"],
["k1","Vad är det djupaste stället som visas på världskartan i boken?","Marianergraven",["Atlantiska centralryggen","San Andreas-förkastningen","Rhendalen"],"Marianergraven är 10 994 m djup.","Boken s. 11"],
["k1","Vilket av följande hör INTE till det man hittar på en bra karta?","Ett foto på den som ritat kartan",["Väderstreck","Skala","Teckenförklaring"],"På en bra karta hittar du väderstreck, skala, teckenförklaring och en rubrik.","Boken s. 12"],
["k1","Vad anger rubriken på en karta?","Var området ligger eller vad kartan handlar om",["Hur mycket kartan är förminskad","Åt vilket håll norr ligger","Vad färgerna betyder"],"Rubriken anger var området ligger eller vad kartan handlar om.","Boken s. 12"],
["k1","Vad använder vi koordinater till?","Att ange positionen för en plats",["Att mäta hur högt ett berg är","Att räkna ut skalan","Att visa vilken tidszon det är"],"Vi använder koordinatsystem (gradnät) för att ange positionen för en plats.","Boken s. 12 + häftet"],
["k1","Breddgrader anger position i förhållande till …","ekvatorn",["nollmeridianen","nordpolen","datumgränsen"],"Med breddgrader anger vi position i förhållande till ekvatorn, som är breddgrad 0.","Boken s. 12"],
["k1","Längdgrader anger position i förhållande till …","nollmeridianen",["ekvatorn","Kräftans vändkrets","norra polcirkeln"],"Med längdgrader anger vi position i förhållande till längdgraden 0, nollmeridianen.","Boken s. 12"],
["k1","Var går nollmeridianen?","Genom Greenwich i London",["Genom Helsingfors","Genom Stilla havet","Genom Nordpolen och Paris"],"Nollmeridianen går genom observatoriet i Greenwich, London.","Boken s. 12–13 + häftet"],
["k1","Vad heter strecket som går mitt över jorden från väster till öster?","Ekvatorn",["Nollmeridianen","Datumgränsen","Norra polcirkeln"],"Ekvatorn går runt jorden i öst–västlig riktning och är breddgrad 0. (Nollmeridianen går från norr till söder.)","Häftet (frågor kap 1, nr 10)"],
["k1","Vad heter strecket som går från norr till söder genom Greenwich?","Nollmeridianen",["Ekvatorn","Kräftans vändkrets","Stenbockens vändkrets"],"Nollmeridianen går i nord–sydlig riktning genom Greenwich och är längdgrad 0.","Häftet (frågor kap 1, nr 11)"],
["k1","I vilken riktning går breddgraderna (latitud)?","Öst–västlig riktning",["Nord–sydlig riktning","Diagonalt","Runt polerna i cirklar som korsar ekvatorn"],"Breddgrader (latitud) är linjer i öst–västlig riktning.","Häftet (gradnät)"],
["k1","I vilken riktning går längdgraderna (longitud)?","Nord–sydlig riktning",["Öst–västlig riktning","Parallellt med ekvatorn","De går bara på södra halvklotet"],"Längdgrader (longitud) är linjer i nord–sydlig riktning, från pol till pol.","Häftet (gradnät)"],
["k1","Vad skiljer ekvatorn åt?","Norra och södra halvklotet",["Västra och östra halvklotet","Två tidszoner","Två litosfärplattor"],"Ekvatorn skiljer södra och norra halvklotet från varandra. Den är den längsta breddgraden.","Häftet (gradnät)"],
["k1","Vad skiljer nollmeridianen åt?","Västra och östra halvklotet",["Norra och södra halvklotet","Lågland och högland","Dag och natt"],"Nollmeridianen skiljer västra och östra halvklotet. I Greenwich kan du stå med en fot på varje halvklot.","Boken s. 13 + häftet"],

["k2","Vad är jordens medeltemperatur tack vare växthuseffekten?","+15 °C",["−18 °C","+30 °C","+5 °C"],"Tack vare växthuseffekten är medeltemperaturen +15 °C i stället för −18 °C.","Boken s. 19"],
["k2","Varför är växthuseffekten nödvändig för livet på jorden?","Utan den skulle det vara för kallt på jorden för att liv skulle kunna uppstå",["Den ger oss syre","Den skyddar mot jordbävningar","Den skapar tidvattnet"],"Utan växthuseffekten skulle det vara för kallt på jorden för att liv skulle kunna uppstå.","Boken s. 19 + häftet"],
["k2","Varför pratar man om att växthuseffekten är något dåligt?","Vi släpper ut koldioxid från fossila bränslen, så växthusgaserna ökar och medeltemperaturen stiger",["Den gör att jorden blir för kall","Den förstör ozonlagret direkt","Den gör att månen kommer närmare"],"Förstärkt växthuseffekt: idag ökar växthusgaserna i atmosfären eftersom vi släpper ut koldioxid från fossila bränslen, t.ex. olja och bensin. Jordens medeltemperatur ökar.","Häftet"],
["k2","Vad kallas solens ljusstrålning som kommer in mot jorden?","Kortvågig strålning",["Långvågig strålning","UV-skydd","Magnetstrålning"],"Ljusstrålningen från solen är kortvågig. Värmestrålningen från jorden är långvågig och en del av den hålls kvar av växthusgaserna.","Häftet (växthuseffekten)"],
["k2","I vilken av jordens sfärer hittar vi växthuseffekten?","Atmosfären",["Litosfären","Hydrosfären","Biosfären"],"Växthuseffekten finns i atmosfären, gashöljet som omger jorden.","Häftet (repetitionsfrågor kap 2)"],
["k2","Vad skyddar oss mot skadlig UV-strålning?","Ozonlagret",["Magnetfältet","Litosfären","Tidvattnet"],"I atmosfären omvandlas en del av syret till ozon (O₃). Ozonlagret skyddar oss mot skadlig UV-strålning.","Boken s. 19"],
["k2","Vad skyddar oss mot skadliga partiklar från solen?","Jordens magnetfält",["Ozonlagret","Hydrosfären","Molnen"],"Jordens magnetfält skyddar oss mot skadliga partiklar från solen.","Boken s. 19"],
["k2","Vad frigörs vid fotosyntesen?","Syre (O₂)",["Koldioxid","Metan","Ozon direkt"],"Tack vare solljuset kan fotosyntes ske i växterna. Vid fotosyntesen frigörs syre (O₂) i atmosfären.","Boken s. 19"],
["k2","Vilken sfär är gashöljet som omger jorden?","Atmosfären",["Biosfären","Litosfären","Hydrosfären"],"Atmosfären är det gashölje som omger jorden.","Boken s. 19 + häftet"],
["k2","Vilken sfär omfattar alla ekosystem och levande organismer på jordklotet?","Biosfären",["Atmosfären","Litosfären","Hydrosfären"],"Biosfären är alla ekosystem och levande organismer på jordklotet.","Boken s. 19 + häftet"],
["k2","Vilken sfär är jordklotets fasta ytskikt?","Litosfären",["Hydrosfären","Atmosfären","Biosfären"],"Litosfären är jordklotets fasta ytskikt.","Boken s. 19 + häftet"],
["k2","Vilken sfär omfattar allt vatten på jorden, även i luften?","Hydrosfären",["Atmosfären","Biosfären","Litosfären"],"Hydrosfären är allt vatten i atmosfären, alla hav, sjöar, floder, glaciärer samt vatten i jordmånen och berggrunden.","Boken s. 19 + häftet"],
["k2","Vad gör att jorden har rätt förutsättningar för liv?","Jordens storlek och lämpliga avstånd till solen",["Att jorden är den största planeten","Att jorden saknar atmosfär","Att jorden har flest månar"],"Jordens storlek och det lämpliga avståndet till solen skapar goda förutsättningar för liv. Här finns flytande vatten och en atmosfär som håller temperaturen på en lagom nivå.","Boken s. 16, 19"],

["k6","När uppstod jorden?","För ca 4,5 miljarder år sedan",["För ca 4,5 miljoner år sedan","För ca 300 miljoner år sedan","För ca 45 000 år sedan"],"Jorden uppstod för cirka 4,5 miljarder år sedan då gaser och damm i det tidiga solsystemet förtätades.","Boken s. 66 + häftet"],
["k6","Hur bildades jordens kärna?","Tunga grundämnen sjönk in mot jordens medelpunkt",["En asteroid slog ner i mitten av jorden","Vatten frös till is i mitten","Lätta gaser samlades i mitten"],"Den unga planeten var ett upphettat magmaklot. Tunga grundämnen sjönk in mot medelpunkten och bildade kärnan.","Boken s. 66"],
["k6","Vilka fyra delar är jordklotet uppdelat i (utifrån och in)?","Jordskorpan, manteln, yttre kärnan, inre kärnan",["Atmosfären, biosfären, hydrosfären, litosfären","Manteln, jordskorpan, inre kärnan, yttre kärnan","Jordskorpan, magman, lavan, kärnan"],"Utifrån och in: jordskorpan, manteln, den flytande yttre kärnan och den fasta inre kärnan.","Boken s. 67 + häftet"],
["k6","Vad består jordens kärna huvudsakligen av?","Järn",["Guld","Granit","Is"],"Kärnan består huvudsakligen av järn.","Boken s. 67"],
["k6","Hur är jordens kärna uppbyggd?","En flytande yttre kärna och en fast inre kärna",["En fast yttre kärna och en flytande inre kärna","Helt flytande","Helt av gas"],"Kärnan delas in i en flytande yttre kärna och en fast inre kärna. Den inre är fast på grund av det höga trycket.","Boken s. 67 + häftet"],
["k6","Varför är den inre kärnan fast trots att den är jättevarm?","På grund av det höga trycket",["För att den är kall","För att den består av is","För att den är ihålig"],"Enligt anteckningarna är den inre kärnan fast på grund av högt tryck.","Häftet (jordens inre)"],
["k6","Hur tjock är jordskorpan?","Ca 8 km under havsbotten och upp till 70 km under stora bergskedjor",["Ca 1 km överallt","Ca 500 km","Ca 6 000 km"],"Jordskorpan är bara omkring 8 km tjock på havsbotten men kan vara upp till 70 km under bergskedjor som Himalaya. I häftet: 8–70 km, som ett äppelskal.","Boken s. 67 + häftet"],
["k6","Vad stämmer om manteln?","Merparten är fast, men under litosfären är stenmaterialet delvis flytande",["Den är helt flytande","Den är det tunnaste lagret","Den består av vatten"],"Den yttre manteln är en del av litosfären. Under litosfären är stenmaterialet delvis flytande, men merparten av manteln är fast. I den inre manteln kan temperaturen vara flera tusen grader.","Boken s. 67"],
["k6","Vad är ett annat ord för kontinentalplatta?","Litosfärplatta",["Mantelplatta","Kärnplatta","Horst"],"Litosfären är indelad i litosfärplattor, som också kallas kontinentalplattor.","Häftet (instuderingsfrågor kap 6)"],
["k6","Varför flyter litosfärplattorna på manteln?","De är lättare än stenmaterialet i manteln",["De är ihåliga","De är gjorda av is","Vinden håller uppe dem"],"Plattorna hålls flytande eftersom de är lättare än stenmaterialet i manteln.","Boken s. 68"],
["k6","Vilka tre saker påverkar litosfärplattornas rörelser?","Tyngdkraften, jordens rotation och magmans strömningar i manteln",["Vinden, regnet och tidvattnet","Månen, solen och stjärnorna","Jordbävningar, tsunamier och vulkaner"],"Tyngdkraften, jordens rotation och magmans strömningar i manteln gör att plattorna långsamt flyttar på sig.","Boken s. 68"],
["k6","Vad beror strömningarna i manteln på?","Temperaturskillnader i jordklotets inre delar",["Månens dragningskraft","Vindar i atmosfären","Havsströmmar"],"Strömningarna i manteln beror på temperaturskillnader i jordklotets inre delar.","Boken s. 68"],
["k6","Hur snabbt rör sig litosfärplattorna ungefär?","Ca 1–10 cm per år",["Ca 1–10 meter per år","Ca 1 km per år","De står helt stilla"],"Enligt anteckningarna rör sig plattorna ca 1–10 cm per år. I Atlanten divergerar de med några centimeter per år.","Häftet + boken s. 69"],
["k6","Vilka är de tre sätt som litosfärplattorna kan röra sig på?","Från varandra, mot varandra och i sidled",["Uppåt, nedåt och runt","Bara mot varandra","Snabbt, långsamt och inte alls"],"Plattorna rör sig mot varandra (kollisionszoner), bort från varandra (spridningszoner) eller i sidled.","Boken s. 68 + häftet"],
["k6","Vad kallas zoner där plattorna rör sig från varandra (divergerar)?","Spridningszoner",["Kollisionszoner","Förkastningar","Hetfläckar"],"Där plattorna rör sig från varandra (divergerar) kallas spridningszoner. Magma tränger upp och ny havsbotten bildas.","Häftet (kontinentaldrift)"],
["k6","Vad hette den senaste superkontinenten?","Pangea",["Eurasien","Atlantis","Vintergatan"],"Den senaste superkontinenten, Pangea, bildades för cirka 300 miljoner år sedan och satt ihop i mer än 100 miljoner år.","Boken s. 68 + häftet"],
["k6","För ungefär hur länge sedan bildades Pangea?","Ca 300 miljoner år sedan",["Ca 4,5 miljarder år sedan","Ca 3 000 år sedan","Ca 30 miljoner år sedan"],"Pangea bildades för cirka 300 miljoner år sedan.","Boken s. 68 + häftet"],
["k6","Vilka två världsdelars konturer passar ihop som bitar i ett pussel?","Sydamerika och Afrika",["Europa och Australien","Asien och Antarktis","Nordamerika och Australien"],"Om du tittar på en världskarta ser du att Sydamerikas och Afrikas konturer passar in i varandra.","Boken s. 68"],
["k6","Vad händer vid de mittoceaniska ryggarna?","Plattorna fjärmar sig från varandra och ny oceanbotten bildas av smält sten från manteln",["Två plattor kolliderar och en bergskedja bildas","En platta skjuts under en annan","Plattorna glider i sidled"],"Vid de mittoceaniska ryggarna fjärmar sig litosfärplattorna från varandra och ny oceanbotten bildas hela tiden.","Boken s. 66"],
["k6","Vad händer när en oceanbottenplatta kolliderar med en kontinentalplatta?","Den oceaniska plattan skjuts in under den kontinentala och en djuphavsgrav uppstår",["Ny oceanbotten bildas","Plattorna glider förbi varandra","En horst bildas"],"Oceanbottenplattan skjuts under kontinentalplattan och det uppstår en djuphavsgrav.","Boken s. 66"],
["k6","Vad händer när två litosfärplattor kolliderar?","Berggrunden veckar sig och bildar en bergskedja",["Ny havsbotten bildas","En gejser bildas","Plattorna smälter direkt"],"När två plattor kolliderar veckar sig berggrunden och bildar en (veck)bergskedja.","Boken s. 67"],
["k6","Hur har Atlantiska centralryggen bildats?","Plattorna rör sig från varandra (divergerar) och magma tränger upp och bildar ny havsbotten",["Två plattor har kolliderat","En asteroid slog ner i Atlanten","Plattorna glider i sidled"],"Vid Atlantiska centralryggen rör sig Eurasiska och Afrikanska plattan från Nord- och Sydamerikanska plattan. Atlantens botten utvidgas.","Boken s. 69 + häftet"],
["k6","Var når Atlantiska centralryggen ovanför havsytan?","Bara på Island",["På Hawaii","I Alperna","På Teneriffa"],"Den mittoceaniska ryggen sträcker sig ovanför havsytan bara på Island. Därför är Island vulkaniskt.","Boken s. 69, 75"],
["k6","Vilken är världens längsta sammanhängande bergskedja?","Atlantiska centralryggen",["Anderna","Himalaya","Alperna"],"Atlantiska centralryggen är omkring 16 000 km lång och därmed världens längsta sammanhängande bergskedja. Anderna är över 7 000 km.","Boken s. 75"],
["k6","Blir jorden större när Atlantens botten utvidgas?","Nej, plattorna trycks in under andra plattor och smälter i manteln",["Ja, några cm per år","Ja, men bara vid Island","Nej, för att vattnet avdunstar"],"Det innebär inte att jordklotet blir större. Plattorna trycks in under andra plattor och smälter i manteln.","Boken s. 69"],

["k6","Vilka är exempel på gamla veckbergskedjor?","Appalacherna och Uralbergen",["Himalaya och Anderna","Alperna och Himalaya","Schwarzwald och Vogeserna"],"Appalacherna i USA och Uralbergen i Ryssland är gamla veckbergskedjor, flera hundra miljoner år gamla.","Boken s. 69"],
["k6","Hur ser unga veckbergskedjor ut?","Höga och branta med spetsiga toppar",["Låga och flacka","Platta som en platå","Som runda kullar"],"De unga veckbergskedjorna är höga och branta med spetsiga toppar. De blir långsamt högre.","Boken s. 69"],
["k6","Varför är gamla veckbergskedjor lägre och flackare?","De har slitits ner av naturkrafter som vatten, is och vind",["De har sjunkit ner i manteln","De har aldrig varit höga","De har sprängts av människor"],"Gamla veckbergskedjor är lägre och flackare eftersom de har slitits ner av vatten, is och vind.","Boken s. 69"],
["k6","För hur länge sedan uppkom de unga veckbergskedjorna?","För omkring 50–70 miljoner år sedan",["För 4,5 miljarder år sedan","För 5 000 år sedan","För 300 miljoner år sedan"],"De unga veckbergskedjorna uppkom för omkring 50–70 miljoner år sedan.","Boken s. 69"],
["k6","Hur har horstar uppkommit?","Efter plötsliga, vertikala rörelser i jordskorpan",["När två plattor kolliderat","Av vulkanutbrott","Av is under istiden"],"Horstar har uppkommit efter plötsliga, vertikala rörelser i jordskorpan, t.ex. Schwarzwald och Vogeserna kring Rhendalen.","Boken s. 69"],
["k6","Vilka bergsmassiv är exempel på horstar?","Schwarzwald och Vogeserna",["Himalaya och Alperna","Appalacherna och Uralbergen","Anderna och Klippiga bergen"],"Schwarzwald och Vogeserna, som ramar in Rhendalen i Centraleuropa, är horstar.","Boken s. 69"],
["k6","Vad är San Andreas-förkastningen ett exempel på?","Plattor som rör sig i sidled",["Plattor som divergerar","En hetfläck","En ung veckbergskedja"],"Vid San Andreas-förkastningen i Kalifornien rör sig plattorna i sidled. Den har orsakat flera stora jordbävningar, bl.a. i San Francisco 1906.","Boken s. 68"],
["k6","Vilken stad förstördes av en jordbävning vid San Andreas-förkastningen år 1906?","San Francisco",["Pompeji","Helsingfors","Los Angeles"],"Den kändaste jordbävningen vid San Andreas-förkastningen förstörde San Francisco år 1906.","Boken s. 68"],
["k6","Hur uppstår en jordbävning?","Plattorna fastnar i varandra, spänningar byggs upp tills berggrunden spricker och energi frigörs",["Vulkanaska regnar ner","Tidvattnet blir för högt","Vinden blåser för hårt"],"När plattorna fastnar växer spänningarna tills berggrunden spricker. Plattorna lossnar, energi frigörs och det blir plötsliga skalv.","Boken s. 68, 70 + häftet"],
["k6","Var sker de flesta jordbävningar?","Vid plattgränser, där plattorna möts, kolliderar eller rör sig i sidled",["Mitt i plattorna","Bara under haven","Bara vid polerna"],"De flesta jordbävningar sker där två litosfärplattor möts och kolliderar eller rör sig i sidled.","Boken s. 70 + häftet"],
["k6","Vad kallas punkten inne i jordskorpan där jordbävningen startar?","Fokus (hypocentrum)",["Epicentrum","Krater","Magmakammare"],"Punkten inne i jordskorpan där jordbävningen startar kallas fokus eller hypocentrum.","Häftet (jordbävningar)"],
["k6","Vad kallas punkten på jordytan rakt ovanför fokus?","Epicentrum",["Hypocentrum","Zenit","Krater"],"Punkten på jordytan rakt ovanför fokus kallas epicentrum.","Häftet (jordbävningar)"],
["k6","Hur sprider sig energin från en jordbävning?","Som seismiska vågor",["Som lava","Som ljusstrålning","Som vind"],"Energin som frigörs i jordskorpan sprider sig som seismiska vågor.","Häftet (jordbävningar)"],
["k6","I vad anges en jordbävnings styrka?","Magnitud",["Grader Celsius","Meter över havet","Kilometer i timmen"],"Styrkan anges i magnituder och mäts med Richterskalan.","Boken s. 70 + häftet"],
["k6","Vad innebär en ökning med en magnitud?","Att jordbävningen blivit tio gånger starkare",["Att den blivit dubbelt så stark","Att den varat en timme längre","Att den blivit en meter djupare"],"En ökning på en magnitud innebär att jordbävningens styrka har blivit tio gånger större.","Boken s. 70"],
["k6","Var uppmättes världens starkaste jordbävning?","I Chile år 1960 (magnitud 9,5)",["I Haiti år 2010","I San Francisco år 1906","I Japan år 2004"],"Världens starkaste jordbävning hade magnituden 9,5 och uppmättes i Chile år 1960.","Boken s. 70"],
["k6","Hur kan man förbereda sig för jordbävningar i storstäder?","Bygga hus och vägar så hållbara och elastiska som möjligt",["Bygga så höga hus som möjligt","Flytta alla till öar","Bygga bara i glas"],"I storstäder förbereder man sig genom att bygga hus och vägar så hållbara och elastiska som möjligt. Geofysiker varnar invånarna.","Boken s. 70 + häftet"],
["k6","Var skedde en av de mest förödande jordbävningarna år 2010?","Haiti",["Chile","Japan","Island"],"Enligt instuderingsfrågorna och dina svar: Haiti år 2010.","Häftet (instuderingsfrågor kap 6)"],
["k6","Hur skapas en tsunami?","En jordbävning under havet sätter vattenmassorna i rörelse",["En stark storm över havet","Tidvattnet blir extra högt","Ett isberg smälter"],"En tsunami beror på att en jordbävning under havet sätter vattenmassorna ovanför jordbävningens centrum i rörelse.","Boken s. 70 + häftet"],
["k6","Vad är ett säkert tecken på en annalkande tsunami?","Att vattennivån sjunker",["Att det börjar regna","Att vinden vänder","Att fåglarna sjunger"],"Ett säkert tecken på en annalkande tsunami är att vattennivån vid stranden sjunker.","Boken s. 70"],
["k6","Hur ser en tsunami ut ute på öppna havet?","Snabba, låga och nästan osynliga vågor",["Jättehöga vågor på flera hundra meter","Stilla vatten utan vågor","En virvel i vattnet"],"På havet färdas tsunamin som snabba, låga och nästan osynliga vågor. Vid kusten reser den sig till en tiotals meter hög flodvåg.","Boken s. 70"],
["k6","Var orsakade tsunamin år 2004 enorm förödelse?","I Sydostasien, efter en jordbävning i Indiska oceanen",["I Chile, efter en jordbävning i Stilla havet","På Island, efter ett vulkanutbrott","I Kalifornien, vid San Andreas"],"Tsunamin 2004 berodde på en underhavsjordbävning i Indiska oceanen. Den krävde mer än 200 000 människoliv.","Boken s. 74"],
["k6","Vad är skillnaden mellan magma och lava?","Magma är smält sten inne i jorden, lava är när magman kommer upp till jordytan",["Lava är smält sten inne i jorden, magma kommer ut ur vulkanen","Det är samma sak","Magma är aska, lava är gas"],"Smält stenmaterial kallas magma. När magman kommer upp till jordytan kallar vi den lava.","Boken s. 72 + häftet"],
["k6","Vad kallas öppningen där en vulkan får utbrott?","Krater",["Epicentrum","Magmakammare","Gejser"],"Utbrottsöppningen kallas krater.","Boken s. 73 + häftet"],
["k6","Vad finns inuti en vulkan och innehåller stora mängder gaser?","En magmakammare",["En gejser","Ett epicentrum","En djuphavsgrav"],"Inuti vulkanen finns en magmakammare. Magma innehåller stora mängder gaser. När trycket ökar spricker berget och magma och gaser väller ut.","Boken s. 73"],
["k6","Vad är typiskt för stratovulkaner?","De består av flera lager lava och aska och har ofta explosionsartade utbrott",["De är flacka och breda med lugna utbrott","De sprutar hett vatten","De finns bara under havet"],"Stratovulkaner består av flera lager lava och aska på varandra. Utbrotten är ofta explosionsartade, t.ex. Stromboli.","Boken s. 72 + häftet"],
["k6","Vad är typiskt för sköldvulkaner?","De är flacka och breda och utbrotten är oftast lugna",["De är spetsiga med explosionsartade utbrott","De består av is","De sprutar vatten med jämna mellanrum"],"Sköldvulkaner är flacka och breda. Utbrotten är lugna och lavan sprider sig över ett stort område, t.ex. Mauna Loa på Hawaii.","Boken s. 72 + häftet"],
["k6","Vilken är världens största aktiva vulkan?","Mauna Loa på Hawaii",["Etna på Sicilien","Vesuvius i Italien","Fuji i Japan"],"Mauna Loa på Hawaii är världens största aktiva vulkan. Det är en sköldvulkan.","Boken s. 72"],
["k6","Vilken vulkan ödelade staden Pompeji år 79?","Vesuvius",["Etna","Stromboli","Mauna Loa"],"Vesuvius ödelade staden Pompeji år 79 i ett explosionsartat utbrott.","Boken s. 72"],
["k6","Var ligger de flesta av jordens vulkaner?","Vid litosfärplattornas gränser",["Mitt i plattorna","Vid polerna","I öknar"],"Största delen av jordens vulkaner ligger vid litosfärplattornas gränser, men det finns också vulkaner i plattornas inre delar.","Boken s. 72"],
["k6","Vilket av följande kan vara farligt vid ett vulkanutbrott?","Aska, brännheta gaser och lava (och lerskred)",["Tidvatten","Norrsken","Midnattssol"],"Vid utbrott frigörs aska och brännheta gaser. Lavaströmmar förstör allt i sin väg och häftiga regn kan blanda sig med askan och bilda farliga lerskred.","Boken s. 72–73 + häftet"],
["k6","Hur kan farliga lerskred bildas vid vulkanutbrott?","Häftiga regn blandas med askan och forsar ner längs sluttningarna",["Snö smälter på Island","Lavan blir till lera","Tidvattnet stiger"],"I samband med vulkanutbrott förekommer ofta häftiga regn. Vattnet blandas med askan och bildar farliga lerskred.","Boken s. 72–73"],

"Tre rörelser: <b>från varandra</b> (spridningszon, ny havsbotten, t.ex. Atlantiska centralryggen), <b>mot varandra</b> (kollisionszon, veckberg eller djuphavsgrav) och <b>i sidled</b> (San Andreas, jordbävningar).",
"<b>Unga veckberg</b>: Himalaya, Anderna, Alperna (50–70 milj. år, höga och spetsiga). <b>Gamla</b>: Appalacherna, Uralbergen (nedslitna). <b>Horstar</b>: Schwarzwald, Vogeserna.",

</script>
<script>
(function(){
"use strict";
const $app = document.getElementById('app');
const CH = {k1:"Kap 1 · Kartor",k2:"Kap 2 · Jorden",k6:"Kap 6 · Stenplaneten"};
const CHS = {k1:"Kap 1",k2:"Kap 2",k6:"Kap 6"};

// ---------- lagring ----------
const KEY = 'geoprov-v1';
let store = {s:{}, ch:'all', theme:null};
try{ const raw = localStorage.getItem(KEY); if(raw){ store = Object.assign(store, JSON.parse(raw)); } }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }
function stat(id){ return store.s[id] || (store.s[id] = {r:0,w:0}); }
function record(id, ok){ const s = stat(id); if(ok){ s.r++; s.last=1; } else { s.w++; s.last=0; } save(); }

// ---------- tema ----------
function applyTheme(){ if(store.theme) document.documentElement.setAttribute('data-theme', store.theme); else document.documentElement.removeAttribute('data-theme'); }
applyTheme();
document.getElementById('themeBtn').onclick = () => {
  const dark = store.theme ? store.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  store.theme = dark ? 'light' : 'dark'; save(); applyTheme();
};

// ---------- hjälp ----------
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const inCh = k => store.ch==='all' || store.ch===k;
function h(html){ keyHandler=null; $app.innerHTML = html; window.scrollTo(0,0); }
function tag(k){ return `<span class="tag ${k}">${CHS[k]}</span>`; }

// Viktat urval: frågor man svarat fel på eller inte sett kommer oftare
function weight(id){
  const s = store.s[id];
  if(!s) return 3;
  let w = 1 + s.w*2 - s.r*0.6;
  if(s.last===0) w += 3;
  return Math.max(0.25, w);
}
function pick(items, n, idf){
  const pool = items.map(it => ({it, w: weight(idf(it)) * (0.6+Math.random())}));
  pool.sort((a,b)=>b.w-a.w);
  return shuffle(pool.slice(0,n).map(p=>p.it));
}

const mcItems = () => MC.map((m,i)=>({id:'m'+i,k:m[0],q:m[1],a:m[2],w:m[3],e:m[4],s:m[5]})).filter(x=>inCh(x.k));
const wrItems = () => WRITE.map((m,i)=>({id:'w'+i,k:m[0],q:m[1],a:m[2],e:m[3]})).filter(x=>inCh(x.k));
const cardItems = () => CARDS.map((m,i)=>({id:'c'+i,k:m[0],t:m[1],d:m[2]})).filter(x=>inCh(x.k));

// ---------- textjämförelse för skrivsvar ----------
function norm(s){
  return String(s).toLowerCase().replace(/−/g,'-').replace(/[°.!?"'()]/g,'').replace(/\s+/g,' ').trim();
}
function strip(s){ return norm(s).normalize('NFD').replace(/[̀-ͯ]/g,''); }
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
function checkWrite(input, answers){
  const x = strip(input); if(!x) return {ok:false};
  for(const a of answers){
    const y = strip(a);
    if(x===y) return {ok:true, exact: norm(input)===norm(a)};
    if(/^[-+0-9, ]+$/.test(y)) continue; // siffror måste vara exakta
    const tol = y.length>=9 ? 2 : (y.length>=5 ? 1 : 0);
    if(lev(x,y)<=tol) return {ok:true, exact:false};
    // tillåt "den heter X" / "X-plattan" osv.
    if(y.length>=4 && (' '+x+' ').includes(' '+y+' ')) return {ok:true, exact:true};
  }
  return {ok:false};
}

// ---------- HEM ----------
function home(){
  const all = [...MC.map((_,i)=>'m'+i), ...WRITE.map((_,i)=>'w'+i)];
  let seen=0, right=0, tot=0;
  all.forEach(id=>{ const s=store.s[id]; if(s){ seen++; tot+=s.r+s.w; right+=s.r; } });
  const wrongNow = all.filter(id=>store.s[id] && store.s[id].last===0).length;
  const chips = [['all','Alla kapitel'],['k1',CH.k1],['k2',CH.k2],['k6',CH.k6]]
    .map(([k,l])=>`<button class="chip" data-ch="${k}" aria-pressed="${store.ch===k}">${l}</button>`).join('');
  h(`
  <div class="chips">${chips}</div>
  <div class="grid">
    <button class="mode" data-go="mc"><span class="ic">✅</span><b>Flervalsfrågor</b><span>10 frågor åt gången, med förklaring efter varje svar.</span></button>
    <button class="mode" data-go="cards"><span class="ic">🃏</span><b>Begreppskort</b><span>Vänd kortet och säg om du kunde. Svåra kort kommer tillbaka.</span></button>
    <button class="mode" data-go="write"><span class="ic">✍️</span><b>Skriv svaret</b><span>Skriv själv. Små stavfel godkänns.</span></button>
    <button class="mode" data-go="coord"><span class="ic">🧭</span><b>Gradnät & koordinater</b><span>Läs av och klicka ut koordinater på en karta.</span></button>
    <button class="mode" data-go="exam"><span class="ic">📝</span><b>Provläge</b><span>20 blandade frågor. Resultat och rättning i slutet.</span></button>
    <button class="mode" data-go="sum"><span class="ic">📖</span><b>Repetera</b><span>Det viktigaste från varje kapitel i korthet.</span></button>
  </div>
  ${wrongNow? `<div class="actions" style="justify-content:flex-start"><button class="btn" data-go="fix">🔁 Öva på ${wrongNow} frågor du svarade fel på senast</button></div>`:''}
  <div class="stats">
    <span>Övade frågor: <b>${seen}</b> av ${all.length}</span>
    <span>Rätt totalt: <b>${tot? Math.round(100*right/tot):0} %</b></span>
    ${seen? '<button class="iconbtn" id="reset">Nollställ statistik</button>':''}
  </div>`);
  $app.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>{ store.ch=b.dataset.ch; save(); home(); });
  $app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>({mc:startMC,cards:startCards,write:startWrite,coord:startCoord,exam:startExam,sum:summary,fix:startFix})[b.dataset.go]());
  const r=document.getElementById('reset'); if(r) r.onclick=()=>{ if(r.dataset.c){ store.s={}; save(); home(); } else { r.dataset.c=1; r.textContent='Säker? Klicka igen'; } };
}
const backBtn = () => `<button class="iconbtn" data-home>← Meny</button>`;
function bindHome(){ $app.querySelectorAll('[data-home]').forEach(b=>b.onclick=home); }

// ---------- FLERVAL ----------
function startMC(list){
  const items = list || pick(mcItems(), 10, x=>x.id);
  runMC(items, 0, []);
}
function runMC(items, i, res){
  if(i>=items.length) return mcDone(items, res);
  const it = items[i];
  const opts = shuffle([it.a, ...it.w]);
  const L = 'ABCD';
  h(`<div class="top">${backBtn()}<span>Fråga ${i+1} av ${items.length}</span></div>
  <div class="bar"><i style="width:${100*i/items.length}%"></i></div>
  <div class="card">
    ${tag(it.k)}
    <div class="q">${esc(it.q)}</div>
    <div class="opts">${opts.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div>
  </div>`);
  bindHome();
  const btns = [...$app.querySelectorAll('.opt')];
  const choose = j => {
    if(btns[0].disabled) return;
    const ok = opts[j]===it.a;
    btns.forEach((b,k)=>{ b.disabled=true; if(opts[k]===it.a) b.classList.add('ok'); else if(k===j) b.classList.add('bad'); });
    record(it.id, ok); res.push({it, ok, given:opts[j]});
    document.getElementById('fb').innerHTML = `<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Rätt!':'Inte riktigt.'}</h3>${ok?'':`<p><b>Rätt svar:</b> ${esc(it.a)}</p>`}<p>${esc(it.e)}</p><span class="src">Källa: ${esc(it.s)}</span></div>
    <div class="actions"><button class="btn primary" id="next">${i+1<items.length?'Nästa →':'Se resultat'}</button></div>`;
    const n=document.getElementById('next'); n.focus(); n.onclick=()=>runMC(items,i+1,res);
  };
  btns.forEach((b,j)=>b.onclick=()=>choose(j));
  keyHandler = e => {
    const k = e.key.toUpperCase(); const j = L.indexOf(k); const d = '1234'.indexOf(e.key);
    if(!btns[0].disabled){ if(j>=0&&j<opts.length) choose(j); else if(d>=0&&d<opts.length) choose(d); }
    else if(e.key==='Enter'){ const n=document.getElementById('next'); if(n){ e.preventDefault(); n.click(); } }
  };
}
function mcDone(items, res){
  const r = res.filter(x=>x.ok).length;
  const wrong = res.filter(x=>!x.ok).map(x=>x.it);
  h(`<div class="top">${backBtn()}<span>Klart!</span></div>
  <div class="card center">
    <div class="muted">Du fick</div><div class="big">${r} / ${res.length}</div>
    <div class="muted">${r===res.length?'Perfekt! 🎉':r>=res.length*0.7?'Bra jobbat!':'Fortsätt öva, det sitter snart.'}</div>
    <div class="actions" style="justify-content:center">
      ${wrong.length?'<button class="btn" id="again">Öva på de fel ('+wrong.length+')</button>':''}
      <button class="btn primary" id="more">10 nya frågor</button>
    </div>
  </div>
  ${reviewList(res)}`);
  bindHome();
  const a=document.getElementById('again'); if(a) a.onclick=()=>startMC(shuffle(wrong));
  document.getElementById('more').onclick=()=>startMC();
}
function reviewList(res){
  const bad = res.filter(x=>!x.ok);
  if(!bad.length) return '';
  return `<div class="card" style="margin-top:14px"><b>Det här ska du titta extra på</b>
  ${bad.map(x=>`<div class="rev"><div>${esc(x.it.q)}</div><div><span class="mark bad">✗</span><span class="muted">Ditt svar: ${esc(x.given||'(tomt)')}</span></div><div><span class="mark ok">✓</span>${esc(Array.isArray(x.it.a)?x.it.a[0]:x.it.a)}</div><div class="src">${esc(x.it.e)}</div></div>`).join('')}</div>`;
}
function startFix(){
  const mcs = mcItems().filter(x=>store.s[x.id]&&store.s[x.id].last===0);
  const wrs = wrItems().filter(x=>store.s[x.id]&&store.s[x.id].last===0);
  if(mcs.length) return startMC(shuffle(mcs).slice(0,15));
  if(wrs.length) return startWrite(shuffle(wrs).slice(0,15));
  home();
}

// ---------- BEGREPPSKORT ----------
let cardDir = 'tf';
function startCards(){
  const deck = pick(cardItems(), 15, x=>x.id);
  runCards(deck, {known:0, total:deck.length, seen:new Set()});
}
function runCards(deck, st){
  if(!deck.length){
    h(`<div class="top">${backBtn()}<span></span></div><div class="card center"><div class="big">🎉</div><p>Du har gått igenom alla ${st.total} kort.</p><div class="actions" style="justify-content:center"><button class="btn primary" id="more">Nya kort</button></div></div>`);
    bindHome(); document.getElementById('more').onclick=startCards; return;
  }
  const c = deck[0];
  const front = cardDir==='tf' ? `<div class="term">${esc(c.t)}</div>` : `<div class="def">${esc(c.d)}</div>`;
  const back = cardDir==='tf' ? `<div class="def">${esc(c.d)}</div>` : `<div class="term">${esc(c.t)}</div>`;
  h(`<div class="top">${backBtn()}<span>Kvar: ${deck.length} · Kan: ${st.known}</span></div>
  <div class="seg"><button data-d="tf" aria-pressed="${cardDir==='tf'}">Begrepp → förklaring</button><button data-d="ft" aria-pressed="${cardDir==='ft'}">Förklaring → begrepp</button></div>
  <div class="flip" id="flip" tabindex="0" role="button" aria-label="Vänd kortet"><div class="in">
    <div class="face">${tag(c.k)}<div style="height:10px"></div>${front}<span class="hint">Tryck för att vända (mellanslag)</span></div>
    <div class="face back">${back}</div>
  </div></div>
  <div class="actions" id="cact" style="justify-content:center;visibility:hidden">
    <button class="btn" id="no">😕 Kan inte än</button><button class="btn primary" id="yes">👍 Kunde</button>
  </div>`);
  bindHome();
  const f=document.getElementById('flip');
  const flip=()=>{ f.classList.toggle('on'); document.getElementById('cact').style.visibility='visible'; };
  f.onclick=flip;
  $app.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{ cardDir=b.dataset.d; runCards(deck,st); });
  const ans = ok => { record(c.id, ok); const rest=deck.slice(1); if(ok){ st.known++; } else { rest.splice(Math.min(rest.length,3),0,c); } runCards(rest, st); };
  document.getElementById('yes').onclick=()=>ans(true);
  document.getElementById('no').onclick=()=>ans(false);
  keyHandler = e => {
    if(e.key===' '){ e.preventDefault(); flip(); }
    else if(f.classList.contains('on')){ if(e.key==='ArrowRight'||e.key==='Enter') ans(true); else if(e.key==='ArrowLeft') ans(false); }
  };
}

// ---------- SKRIV SVARET ----------
function startWrite(list){
  const items = list || pick(wrItems(), 10, x=>x.id);
  runWrite(items, 0, []);
}
function runWrite(items, i, res){
  if(i>=items.length){
    const r=res.filter(x=>x.ok).length; const wrong=res.filter(x=>!x.ok).map(x=>x.it);
    h(`<div class="top">${backBtn()}<span>Klart!</span></div><div class="card center"><div class="muted">Du fick</div><div class="big">${r} / ${res.length}</div>
    <div class="actions" style="justify-content:center">${wrong.length?'<button class="btn" id="again">Öva på de fel ('+wrong.length+')</button>':''}<button class="btn primary" id="more">10 nya frågor</button></div></div>${reviewList(res)}`);
    bindHome(); const a=document.getElementById('again'); if(a) a.onclick=()=>startWrite(shuffle(wrong)); document.getElementById('more').onclick=()=>startWrite(); return;
  }
  const it = items[i];
  h(`<div class="top">${backBtn()}<span>Fråga ${i+1} av ${items.length}</span></div>
  <div class="bar"><i style="width:${100*i/items.length}%"></i></div>
  <div class="card">${tag(it.k)}<div class="q">${esc(it.q)}</div>
  <form id="f" autocomplete="off"><input type="text" id="inp" placeholder="Skriv ditt svar …" autocapitalize="off" spellcheck="false">
  <div class="actions"><button type="button" class="btn ghost" id="skip">Vet inte</button><button class="btn primary" id="chk">Kontrollera</button></div></form>
  <div id="fb"></div></div>`);
  bindHome();
  const inp=document.getElementById('inp'); inp.focus();
  let done=false;
  const finish = (given)=>{
    if(done) return; done=true;
    const c = checkWrite(given, it.a);
    inp.disabled=true; document.getElementById('chk').style.display='none'; document.getElementById('skip').style.display='none';
    const entry={it, ok:c.ok, given}; res.push(entry); record(it.id, c.ok);
    const fb=document.getElementById('fb');
    fb.innerHTML = `<div class="fb ${c.ok?'ok':'bad'}"><h3>${c.ok?(c.exact?'Rätt!':'Rätt! (kolla stavningen)'):'Inte riktigt.'}</h3><p><b>Svar:</b> ${esc(it.a[0])}</p><p>${esc(it.e)}</p></div>
    <div class="actions">${c.ok?'':'<button class="btn ghost" id="ov">Jag hade rätt</button>'}<button class="btn primary" id="next">${i+1<items.length?'Nästa →':'Se resultat'}</button></div>`;
    const ov=document.getElementById('ov'); if(ov) ov.onclick=()=>{ entry.ok=true; const s=stat(it.id); s.w=Math.max(0,s.w-1); s.r++; s.last=1; save(); ov.remove(); fb.querySelector('.fb').className='fb ok'; fb.querySelector('h3').textContent='Godkänt'; };
    const n=document.getElementById('next'); n.focus(); n.onclick=()=>runWrite(items,i+1,res);
  };
  document.getElementById('f').onsubmit=e=>{ e.preventDefault(); if(!done) finish(inp.value); };
  document.getElementById('skip').onclick=()=>finish('');
  keyHandler=null;
}

// ---------- KOORDINATER ----------
const X0=24, Y0=22; // 1 grad = 1 enhet
const px = lon => X0 + (lon+180);
const py = lat => Y0 + (90-lat);
function fmt(lat,lon){
  const a = lat===0? '0°' : Math.abs(lat)+'°'+(lat>0?'N':'S');
  const b = lon===0? '0°' : Math.abs(lon)+'°'+(lon>0?'E':'W');
  return a+', '+b;
}
const lonTxt = lon => lon===0?'0°':Math.abs(lon)+(lon>0?'E':'W');
function mapSVG(extra, hideNames){
  let g='';
  for(let lon=-170; lon<=170; lon+=10){ g+=`<line class="gl${lon%20?'':' g2'}" x1="${px(lon)}" y1="${py(90)}" x2="${px(lon)}" y2="${py(-90)}"/>`; }
  for(let lat=-80; lat<=80; lat+=10){ g+=`<line class="gl${lat%20?'':' g2'}" x1="${px(-180)}" y1="${py(lat)}" x2="${px(180)}" y2="${py(lat)}"/>`; }
  let lab='';
  for(let lon=-160; lon<=160; lon+=40){ lab+=`<text x="${px(lon)}" y="${py(-90)+11}" text-anchor="middle">${lonTxt(lon)}</text>`; }
  for(let lon=-140; lon<=140; lon+=40){ lab+=`<text x="${px(lon)}" y="${py(90)-4}" text-anchor="middle">${lonTxt(lon)}</text>`; }
  for(let lat=-80; lat<=80; lat+=20){ lab+=`<text x="${px(-180)-3}" y="${py(lat)+3.5}" text-anchor="end">${lat===0?'0°':Math.abs(lat)+(lat>0?'N':'S')}</text>`; }
  const sp=[[66.5,'Norra polcirkeln 66,5°N'],[23.5,'Kräftans vändkrets 23,5°N'],[-23.5,'Stenbockens vändkrets 23,5°S'],[-66.5,'Södra polcirkeln 66,5°S']];
  const s=sp.map(([lat,n])=>`<line class="sp" x1="${px(-180)}" y1="${py(lat)}" x2="${px(180)}" y2="${py(lat)}"/>`+(hideNames?'':`<text class="lbl" x="${px(178)}" y="${py(lat)-2}" text-anchor="end">${n}</text>`)).join('');
  return `<svg class="map" viewBox="0 0 ${X0+366} ${Y0+196}" id="map" role="img" aria-label="Gradnät">
    <rect x="${px(-180)}" y="${py(90)}" width="360" height="180" fill="var(--card)" stroke="var(--muted)" stroke-width=".6"/>
    ${g}${s}
    <line class="eq" x1="${px(-180)}" y1="${py(0)}" x2="${px(180)}" y2="${py(0)}"/>
    <line class="mer" x1="${px(0)}" y1="${py(90)}" x2="${px(0)}" y2="${py(-90)}"/>
    ${hideNames?'':`<text x="${px(-178)}" y="${py(0)-3}" class="lbl" style="fill:var(--eq)">Ekvatorn</text><text x="${px(2)}" y="${py(-86)}" class="lbl" style="fill:var(--mer)">Nollmeridianen</text>`}
    <text x="${px(-90)}" y="${py(-84)}" text-anchor="middle" class="lbl hk">VÄSTRA HALVKLOTET (W)</text>
    <text x="${px(90)}" y="${py(-84)}" text-anchor="middle" class="lbl hk">ÖSTRA HALVKLOTET (E)</text>
    ${lab}${extra||''}
  </svg>
  <div class="legend"><span><i style="background:var(--eq)"></i>Ekvatorn (breddgrad 0)</span><span><i style="background:var(--mer)"></i>Nollmeridianen (längdgrad 0)</span><span><i style="background:var(--special)"></i>Polcirklar och vändkretsar</span><span>Varje ruta = 10°</span></div>`;
}
function rndPoint(){
  let lat, lon;
  do{ lat = (Math.floor(Math.random()*15)-7)*10; lon = (Math.floor(Math.random()*35)-17)*10; } while(lat===0 && lon===0);
  if(Math.random()<0.15) lat=0;
  return {lat, lon};
}
function startCoord(){ runCoord({n:0, r:0}); }
function runCoord(st){
  const type = st.n%3===2 ? 'click' : (st.n%3===1 ? 'special' : 'read');
  if(type==='special') return coordSpecial(st);
  const p = rndPoint();
  if(type==='read'){
    const cand = new Set([fmt(p.lat,p.lon)]);
    const vars=[[ -p.lat, p.lon],[p.lat,-p.lon],[-p.lat,-p.lon],[p.lat+10*(p.lat<70?1:-1),p.lon],[p.lat,p.lon+20*(p.lon<160?1:-1)]];
    if(Math.abs(p.lon)<=80 && p.lat!==0) vars.push([p.lon, p.lat]);
    for(const v of shuffle(vars)){ if(cand.size>=4) break; if(Math.abs(v[0])<=80 && Math.abs(v[1])<=180) cand.add(fmt(v[0],v[1])); }
    const opts=shuffle([...cand]); const right=fmt(p.lat,p.lon);
    h(`<div class="top">${backBtn()}<span>Rätt: ${st.r} av ${st.n}</span></div><div class="card">
      <div class="q">Vilka koordinater har punkten?</div>
      ${mapSVG(`<circle class="dot" cx="${px(p.lon)}" cy="${py(p.lat)}" r="4"/><circle cx="${px(p.lon)}" cy="${py(p.lat)}" r="8" fill="none" stroke="var(--ink)" stroke-width="1"/>`)}
      <div class="opts" style="margin-top:12px">${opts.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${'ABCD'[j]}</span><span>${o}</span></button>`).join('')}</div>
      <div id="fb"></div></div>`);
    bindHome();
    const btns=[...$app.querySelectorAll('.opt')];
    const choose=j=>{ if(btns[0].disabled) return; const ok=opts[j]===right; btns.forEach((b,k)=>{b.disabled=true; if(opts[k]===right) b.classList.add('ok'); else if(k===j) b.classList.add('bad');});
      st.n++; if(ok) st.r++;
      document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Rätt!':'Inte riktigt.'}</h3><p>Punkten ligger på <b>${right}</b>. ${tipLat(p.lat)} ${tipLon(p.lon)}</p><span class="src">Breddgraden (N/S) skrivs först, sedan längdgraden (E/W).</span></div><div class="actions"><button class="btn primary" id="next">Nästa →</button></div>`;
      const n=document.getElementById('next'); n.focus(); n.onclick=()=>runCoord(st); };
    btns.forEach((b,j)=>b.onclick=()=>choose(j));
    keyHandler=e=>{ const j='ABCD'.indexOf(e.key.toUpperCase()); if(!btns[0].disabled&&j>=0&&j<opts.length) choose(j); else if(e.key==='Enter'){const n=document.getElementById('next'); if(n){e.preventDefault(); n.click();}} };
  } else {
    h(`<div class="top">${backBtn()}<span>Rätt: ${st.r} av ${st.n}</span></div><div class="card">
      <div class="q">Klicka på <b>${fmt(p.lat,p.lon)}</b></div>
      ${mapSVG(`<rect class="hit" x="${px(-180)}" y="${py(90)}" width="360" height="180" id="hit"/><g id="marks"></g>`)}
      <div id="fb"></div></div>`);
    bindHome();
    const svg=document.getElementById('map'); let done=false;
    svg.addEventListener('click', ev=>{
      if(done) return;
      const pt=svg.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY;
      const loc=pt.matrixTransform(svg.getScreenCTM().inverse());
      const lon=Math.round((loc.x-X0-180)/10)*10, lat=Math.round((90-(loc.y-Y0))/10)*10;
      if(Math.abs(lon)>180||Math.abs(lat)>90) return;
      done=true; const ok = lat===p.lat && lon===p.lon; st.n++; if(ok) st.r++;
      document.getElementById('marks').innerHTML = `<circle cx="${px(lon)}" cy="${py(lat)}" r="5" fill="${ok?'var(--ok)':'var(--bad)'}"/>` + (ok?'':`<circle cx="${px(p.lon)}" cy="${py(p.lat)}" r="5" fill="var(--ok)"/><circle cx="${px(p.lon)}" cy="${py(p.lat)}" r="9" fill="none" stroke="var(--ok)"/>`);
      document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Rätt!':'Inte riktigt.'}</h3><p>${ok?'':`Du klickade på ${fmt(lat,lon)}. Den gröna punkten är ${fmt(p.lat,p.lon)}. `}${tipLat(p.lat)} ${tipLon(p.lon)}</p></div><div class="actions"><button class="btn primary" id="next">Nästa →</button></div>`;
      const n=document.getElementById('next'); n.focus(); n.onclick=()=>runCoord(st);
    });
    keyHandler=e=>{ if(e.key==='Enter'){const n=document.getElementById('next'); if(n){e.preventDefault(); n.click();}} };
  }
}
function tipLat(lat){ return lat===0?'Den ligger på ekvatorn.':(lat>0?'N betyder norr om ekvatorn.':'S betyder söder om ekvatorn.'); }
function tipLon(lon){ return lon===0?'Den ligger på nollmeridianen.':(lon>0?'E betyder öster om nollmeridianen.':'W betyder väster om nollmeridianen.'); }
const SPECIAL = [
  {q:'Vilken linje går på 66,5°N?', a:'Norra polcirkeln', lat:66.5},
  {q:'Vilken linje går på 23,5°N?', a:'Kräftans vändkrets', lat:23.5},
  {q:'Vilken linje går på 0° breddgrad?', a:'Ekvatorn', lat:0},
  {q:'Vilken linje går på 23,5°S?', a:'Stenbockens vändkrets', lat:-23.5},
  {q:'Vilken linje går på 66,5°S?', a:'Södra polcirkeln', lat:-66.5},
  {q:'Vilken linje går på 0° längdgrad, genom Greenwich?', a:'Nollmeridianen', lon:0},
  {q:'Vilken linje följer 180-gradersmeridianen genom Stilla havet?', a:'Datumgränsen', lon:180},
  {q:'Helsingfors ligger på 60°N, 24°E. På vilket halvklot ligger staden (norr/söder)?', a:'Norra halvklotet', opts:['Norra halvklotet','Södra halvklotet']},
  {q:'En plats har koordinaterna 30°S, 60°W. Var ligger den?', a:'Söder om ekvatorn och väster om nollmeridianen', opts:['Söder om ekvatorn och väster om nollmeridianen','Norr om ekvatorn och väster om nollmeridianen','Söder om ekvatorn och öster om nollmeridianen','Norr om ekvatorn och öster om nollmeridianen']},
  {q:'En plats har koordinaterna 40°N, 116°E. Var ligger den?', a:'Norr om ekvatorn och öster om nollmeridianen', opts:['Norr om ekvatorn och öster om nollmeridianen','Söder om ekvatorn och öster om nollmeridianen','Norr om ekvatorn och väster om nollmeridianen','Söder om ekvatorn och väster om nollmeridianen']},
];
function coordSpecial(st){
  const s = SPECIAL[Math.floor(Math.random()*SPECIAL.length)];
  const all=['Norra polcirkeln','Kräftans vändkrets','Ekvatorn','Stenbockens vändkrets','Södra polcirkeln','Nollmeridianen','Datumgränsen'];
  const opts = s.opts ? shuffle(s.opts) : shuffle([s.a, ...shuffle(all.filter(x=>x!==s.a)).slice(0,3)]);
  let mark='';
  if(s.lat!==undefined) mark=`<line x1="${px(-180)}" y1="${py(s.lat)}" x2="${px(180)}" y2="${py(s.lat)}" stroke="var(--ink)" stroke-width="3" opacity=".75"/>`;
  if(s.lon!==undefined) mark=`<line x1="${px(s.lon===180?179.5:s.lon)}" y1="${py(90)}" x2="${px(s.lon===180?179.5:s.lon)}" y2="${py(-90)}" stroke="var(--ink)" stroke-width="3" opacity=".75"/>`;
  h(`<div class="top">${backBtn()}<span>Rätt: ${st.r} av ${st.n}</span></div><div class="card">
    <div class="q">${esc(s.q)}</div>
    ${s.opts?'':`<div class="muted" style="margin:-8px 0 10px;font-size:.9rem">Den tjocka svarta linjen visar var den går. Namnen är dolda, försök utan att fuska!</div>`}
    ${s.opts?'':mapSVG(mark,true)}
    <div class="opts" style="margin-top:12px">${opts.map((o,j)=>`<button class="opt" data-o="${j}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fb"></div></div>`);
  bindHome();
  const btns=[...$app.querySelectorAll('.opt')];
  const choose=j=>{ if(btns[0].disabled) return; const ok=opts[j]===s.a; btns.forEach((b,k)=>{b.disabled=true; if(opts[k]===s.a) b.classList.add('ok'); else if(k===j) b.classList.add('bad');}); st.n++; if(ok) st.r++;
    document.getElementById('fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><h3>${ok?'Rätt!':'Inte riktigt.'}</h3><p>Rätt svar: <b>${esc(s.a)}</b>.</p><span class="src">Polcirklarna 66,5°, vändkretsarna 23,5°, ekvatorn 0°, nollmeridianen 0° (Greenwich), datumgränsen 180°.</span></div><div class="actions"><button class="btn primary" id="next">Nästa →</button></div>`;
    const n=document.getElementById('next'); n.focus(); n.onclick=()=>runCoord(st); };
  btns.forEach((b,j)=>b.onclick=()=>choose(j));
  keyHandler=e=>{ const j='ABCD'.indexOf(e.key.toUpperCase()); if(!btns[0].disabled&&j>=0&&j<opts.length) choose(j); else if(e.key==='Enter'){const n=document.getElementById('next'); if(n){e.preventDefault(); n.click();}} };
}

// ---------- PROVLÄGE ----------
function startExam(){
  const mcs = shuffle(mcItems()).slice(0,15).map(x=>Object.assign({type:'mc', opts:shuffle([x.a,...x.w])},x));
  const wrs = shuffle(wrItems()).slice(0,5).map(x=>Object.assign({type:'wr'},x));
  const items = shuffle([...mcs, ...wrs]);
  const ans = new Array(items.length).fill(null);
  examQ(items, ans, 0);
}
function examQ(items, ans, i){
  const it=items[i];
  const body = it.type==='mc'
    ? `<div class="opts">${it.opts.map((o,j)=>`<button class="opt ${ans[i]===o?'sel':''}" data-o="${j}" style="${ans[i]===o?'border-color:var(--accent);background:var(--accent-soft)':''}"><span class="k">${'ABCD'[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>`
    : `<input type="text" id="inp" placeholder="Skriv ditt svar …" value="${esc(ans[i]||'')}" autocomplete="off" spellcheck="false">`;
  const answered = ans.filter(a=>a!==null && a!=='').length;
  h(`<div class="top">${backBtn()}<span>Provläge · fråga ${i+1} av ${items.length} · besvarade ${answered}</span></div>
  <div class="bar"><i style="width:${100*answered/items.length}%"></i></div>
  <div class="card">${tag(it.k)}<div class="q">${esc(it.q)}</div>${body}
  <div class="actions" style="justify-content:space-between"><button class="btn" id="prev" ${i===0?'disabled':''}>← Förra</button>
  ${i+1<items.length?'<button class="btn primary" id="nx">Nästa →</button>':'<button class="btn primary" id="end">Lämna in provet</button>'}</div></div>
  <div class="actions" style="justify-content:center">${i+1<items.length?'<button class="btn ghost" id="end2">Lämna in nu</button>':''}</div>`);
  bindHome();
  const store1=()=>{ if(it.type==='wr'){ ans[i]=document.getElementById('inp').value; } };
  if(it.type==='mc'){ $app.querySelectorAll('.opt').forEach((b,j)=>b.onclick=()=>{ ans[i]=it.opts[j]; if(i+1<items.length) examQ(items,ans,i+1); else examQ(items,ans,i); }); }
  else { const inp=document.getElementById('inp'); inp.focus(); inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); store1(); if(i+1<items.length) examQ(items,ans,i+1); } }; }
  document.getElementById('prev').onclick=()=>{ store1(); examQ(items,ans,i-1); };
  const nx=document.getElementById('nx'); if(nx) nx.onclick=()=>{ store1(); examQ(items,ans,i+1); };
  const end=()=>{ store1(); examDone(items,ans); };
  const e1=document.getElementById('end'); if(e1) e1.onclick=end;
  const e2=document.getElementById('end2'); if(e2) e2.onclick=end;
  keyHandler = it.type==='mc' ? (e=>{ const j='ABCD'.indexOf(e.key.toUpperCase()); if(j>=0&&j<it.opts.length){ ans[i]=it.opts[j]; if(i+1<items.length) examQ(items,ans,i+1); else examQ(items,ans,i);} }) : null;
}
function examDone(items, ans){
  const res = items.map((it,i)=>{
    const ok = it.type==='mc' ? ans[i]===it.a : checkWrite(ans[i]||'', it.a).ok;
    record(it.id, ok);
    return {it, ok, given: ans[i]};
  });
  const r=res.filter(x=>x.ok).length, pct=Math.round(100*r/res.length);
  const byCh={}; res.forEach(x=>{ const c=byCh[x.it.k]||(byCh[x.it.k]={r:0,n:0}); c.n++; if(x.ok) c.r++; });
  h(`<div class="top">${backBtn()}<span>Provresultat</span></div>
  <div class="card center"><div class="muted">Resultat</div><div class="big">${r} / ${res.length}</div><div class="muted">${pct} % rätt</div>
  <div class="stats" style="justify-content:center">${Object.keys(byCh).sort().map(k=>`<span>${CHS[k]}: <b>${byCh[k].r}/${byCh[k].n}</b></span>`).join('')}</div>
  <div class="actions" style="justify-content:center"><button class="btn primary" id="new">Nytt prov</button></div></div>
  ${reviewList(res)}`);
  bindHome(); document.getElementById('new').onclick=startExam;
}

// ---------- REPETERA ----------
function summary(){
  const ks = ['k1','k2','k6'].filter(inCh);
  h(`<div class="top">${backBtn()}<span>Repetera</span></div>
  ${ks.map(k=>`<div class="card sum">${tag(k)}<h2 style="margin-top:6px">${SUMMARY[k].title}</h2><div class="src">${SUMMARY[k].src}</div><ul class="list">${SUMMARY[k].pts.map(p=>`<li>${p}</li>`).join('')}</ul></div>`).join('')}`);
  bindHome();
}

// ---------- tangentbord ----------
let keyHandler=null;
document.addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; if(keyHandler) keyHandler(e); });

home();
})();
